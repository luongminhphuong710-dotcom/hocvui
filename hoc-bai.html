<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Học bài - Học vui - Vui học</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="app.css" />
    <link rel="stylesheet" href="hoc-bai.css" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="index.html" aria-label="Về trang Hôm nay">
        <span class="brand-mark" aria-hidden="true">HV</span>
        <span>Học vui - Vui học</span>
      </a>
      <nav class="topnav" aria-label="Trang chính">
        <a href="index.html">Hôm nay</a>
        <a class="is-active" href="hoc-bai.html">Học bài</a>
        <a href="tro-choi.html">Trò chơi</a>
        <a href="giai-tri.html">Giải trí</a>
        <a href="chup-anh-vui.html">Chụp ảnh</a>
      </nav>
    </header>

    <main class="today">
      <section class="learn-hero">
        <div>
          <p class="hello" id="gradeLabel">Chương trình lớp 2</p>
          <h1>Học bài</h1>
          <p class="hero-sub">Đi lần lượt từng bài trên lộ trình. Mỗi bài có phần ghi nhớ và luyện tập, làm xong thì mở bài tiếp theo.</p>
        </div>
        <div class="mode-tabs" role="tablist" aria-label="Chọn phần học">
          <button type="button" role="tab" class="is-on" data-mode="path">📚 Lộ trình bài học</button>
          <button type="button" role="tab" data-mode="video">🎬 Video kiến thức</button>
        </div>
      </section>

      <section id="pathView">
        <div class="subj-tabs" id="subjTabs" role="tablist" aria-label="Chọn môn"></div>
        <div class="path-layout">
          <aside class="goal-card" id="goalCard"></aside>
          <ol class="path" id="path"></ol>
        </div>
      </section>

      <section id="lessonView" class="lesson-view" hidden aria-live="polite"></section>

      <section id="videoView" hidden>
        <div class="subj-tabs" id="vidTabs" role="tablist" aria-label="Chọn môn video"></div>
        <div class="vid-head">
          <p id="vidInfo" class="muted"></p>
        </div>
        <div class="vid-grid" id="vidGrid"></div>
      </section>
    </main>

    <div class="vid-modal" id="vidModal" hidden>
      <div class="vid-box" role="dialog" aria-modal="true" aria-labelledby="vidTitle">
        <div class="vid-bar"><strong id="vidTitle"></strong><button class="p-x" id="vidClose" aria-label="Đóng video">✕</button></div>
        <div class="vid-frame"><iframe id="vidFrame" title="Video bài học" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe></div>
      </div>
    </div>

    <script src="auth.js"></script>
    <script src="common.js"></script>
    <script src="lesson-data.js"></script>
    <script src="curriculum.js"></script>
    <script src="hoc-bai.js"></script>
  </body>
</html>
