<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Nông Trại Công Chúa</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800;900&display=swap">
<style>
/* Layout: one-screen toy game. A pastel sky over rolling hills; a raised meadow patch holds a 4x3 grid of soil plots (3x4 on phones).
   The child's own princess stands at the left as the guide (bottom strip on phones). Quizzes open as big centered cards.
   Deliberate single daylight look: every color is set explicitly so it reads the same on any host theme. */
:root{
  --sky-1:#aee0ff; --sky-2:#ffe6f2;
  --hill-back:#cdeeb4; --meadow:#a9e39a; --meadow-2:#8fd486; --meadow-3:#6cbf6f;
  --soil:#c9926c; --soil-2:#b37b56; --soil-3:#8f5d3d;
  --pink:#ff86b3; --pink-2:#e9578f; --pink-soft:#ffe1ee;
  --mint:#8fe3cb; --mint-2:#3fae8d; --mint-soft:#dcf7ef;
  --butter:#fff3c7; --gold:#ffc93c; --gold-2:#e0a114;
  --lav:#cbb8f5; --lav-2:#8f72dd; --lav-soft:#efe8ff;
  --ink:#5b3a5e; --ink-soft:#8a6a8d;
  --card:#fffdf8; --line:#f3d6e4;
  --good:#3fbf78; --good-soft:#d9f7e6; --bad:#ff6f86; --bad-soft:#ffe3e8;
  --shade:rgba(91,58,94,.38);
  --f-display:"Baloo 2","Nunito","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Nunito","Segoe UI",system-ui,sans-serif;
  color-scheme: light;
}
html{box-sizing:border-box;height:100%}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;background:var(--sky-1);color:var(--ink);font-family:var(--f-body);font-weight:700;font-size:18px;overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;touch-action:manipulation}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible{outline:4px solid var(--lav-2);outline-offset:3px}
input{font:inherit;color:var(--ink);-webkit-user-select:text;user-select:text}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;line-height:1.1}

/* ---------- world backdrop ---------- */
.world{position:fixed;inset:0;z-index:0;overflow:hidden;background:linear-gradient(180deg,var(--sky-1) 0%,var(--sky-2) 58%,var(--sky-2) 100%)}
.sun{position:absolute;top:5%;right:6%;width:clamp(70px,9vw,110px);aspect-ratio:1;max-width:100%}
.sun .rays{transform-origin:50% 50%;transform-box:fill-box;animation:spin 40s linear infinite}
.cloud{position:absolute;left:0;width:var(--w,140px);height:calc(var(--w,140px)*.34);background:#fff;border-radius:999px;opacity:.95;animation:drift var(--t,70s) linear infinite;animation-delay:var(--d,0s);transform:translateX(-30vw)}
.cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
.cloud::before{width:46%;aspect-ratio:1;left:14%;bottom:30%}
.cloud::after{width:34%;aspect-ratio:1;left:50%;bottom:36%}
.hills{position:absolute;left:0;right:0;bottom:0;width:100%;height:62%}
.butterfly{position:absolute;width:34px;height:34px;animation:flutter-path var(--t,18s) ease-in-out infinite;animation-delay:var(--d,0s)}
.butterfly .wing{transform-box:fill-box;transform-origin:100% 50%;animation:flap .35s ease-in-out infinite alternate}
.butterfly .wing.r{transform-origin:0% 50%}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes drift{from{transform:translateX(-30vw)}to{transform:translateX(115vw)}}
@keyframes flap{to{transform:scaleX(.35)}}
@keyframes flutter-path{0%{transform:translate(8vw,46vh)}25%{transform:translate(30vw,38vh) rotate(8deg)}50%{transform:translate(70vw,44vh)}75%{transform:translate(88vw,34vh) rotate(-8deg)}100%{transform:translate(8vw,46vh)}}

/* ---------- screens ---------- */
#app{position:relative;z-index:1;height:100%}
.screen{height:100%;display:flex;flex-direction:column;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px;animation:fadeIn .35s ease}
@keyframes fadeIn{from{opacity:.001;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:58px;padding:10px 28px;border-radius:999px;font-family:var(--f-display);font-weight:800;font-size:22px;background:var(--pink);color:#fff;box-shadow:0 6px 0 var(--pink-2);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--pink-2)}
.btn[disabled]{background:#e7d9e4;box-shadow:0 6px 0 #cdb8c9;color:#fff;cursor:not-allowed}
.btn.mint{background:var(--mint-2);box-shadow:0 6px 0 #2d8a6e}
.btn.lav{background:var(--lav-2);box-shadow:0 6px 0 #6b51b8}
.btn.soft{background:var(--card);color:var(--ink);box-shadow:0 6px 0 var(--line)}
.btn.small{min-height:48px;font-size:18px;padding:8px 18px}
.icon-btn{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:0 5px 0 var(--line);flex:none;transition:transform .08s}
.icon-btn:active{transform:translateY(3px)}
.icon-btn svg{width:30px;height:30px}
.bounce{animation:bounce .5s}
@keyframes bounce{0%,100%{transform:scale(1)}40%{transform:scale(1.18)}70%{transform:scale(.95)}}

/* ---------- profile screen ---------- */
.home{justify-content:center;align-items:center;gap:22px;text-align:center;overflow-y:auto}
.logo{display:flex;flex-direction:column;align-items:center;gap:0}
.logo svg{width:76px;height:52px;animation:bob 2.4s ease-in-out infinite}
.logo h1{font-size:clamp(40px,7.5vw,78px);font-weight:800;color:var(--pink-2);-webkit-text-stroke:10px var(--card);paint-order:stroke fill;letter-spacing:.5px}
.logo .sub{font-family:var(--f-display);font-size:clamp(20px,3vw,28px);color:var(--lav-2);-webkit-text-stroke:6px var(--card);paint-order:stroke fill;margin-top:-6px}
.who{font-size:22px;color:var(--ink)}
.pgrid{display:flex;flex-wrap:wrap;gap:18px;justify-content:center;max-width:820px}
.pcard{width:158px;padding:14px 10px 12px;border-radius:30px;background:var(--card);border:4px solid #fff;box-shadow:0 8px 0 var(--line);display:flex;flex-direction:column;align-items:center;gap:6px;transition:transform .12s}
.pcard:hover{transform:translateY(-4px) rotate(-1deg)}
.pcard:active{transform:translateY(3px)}
.pcard .av{width:104px;height:104px;border-radius:50%;background:var(--pink-soft);display:grid;place-items:center;overflow:hidden}
.pcard .av svg{width:96px;height:96px;margin-top:10px}
.pcard .nm{font-family:var(--f-display);font-size:24px;font-weight:800;line-height:1.1;max-width:100%;overflow-wrap:anywhere}
.pcard .meta{font-size:15px;color:var(--ink-soft);display:flex;align-items:center;gap:4px}
.pcard.new{border:4px dashed var(--pink);background:rgba(255,253,248,.75);box-shadow:none;justify-content:center;min-height:196px}
.pcard.new .plus{width:72px;height:72px;border-radius:50%;background:var(--pink);color:#fff;font-family:var(--f-display);font-size:52px;line-height:72px}
.home-foot{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:center}
.sync{font-size:14px;color:var(--ink-soft);background:rgba(255,253,248,.8);padding:6px 14px;border-radius:999px}

/* ---------- create screen ---------- */
.create{align-items:center;overflow-y:auto}
.create-card{width:100%;max-width:640px;margin:auto 0;background:var(--card);border:6px solid #fff;border-radius:36px;box-shadow:0 10px 0 var(--line);padding:22px clamp(16px,4vw,32px);display:flex;flex-direction:column;gap:18px}
.create-card h2{font-size:34px;color:var(--pink-2);text-align:center}
.field-lbl{font-family:var(--f-display);font-size:21px;font-weight:700;display:block;margin-bottom:8px}
.name-in{width:100%;min-height:60px;border-radius:20px;border:4px solid var(--line);background:#fff;padding:8px 18px;font-size:26px;font-weight:800}
.name-in:focus{border-color:var(--pink);outline:none}
.avpick{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.avpick button{aspect-ratio:1;max-width:100%;border-radius:50%;background:var(--pink-soft);border:4px solid transparent;overflow:hidden;display:grid;place-items:center;transition:transform .1s}
.avpick button svg{width:92%;height:92%;margin-top:12%}
.avpick button[aria-pressed="true"]{border-color:var(--pink-2);transform:scale(1.08);background:var(--butter)}
.code-slots{display:flex;gap:12px;justify-content:center}
.code-slot{width:64px;height:64px;border-radius:20px;background:var(--lav-soft);border:4px dashed var(--lav);display:grid;place-items:center;font-size:38px}
.code-slot.filled{border-style:solid;background:#fff;animation:bounce .35s}
.keypad{display:grid;grid-template-columns:repeat(3,72px);gap:10px;justify-content:center}
.keypad button{width:72px;height:72px;border-radius:22px;background:#fff;box-shadow:0 5px 0 var(--line);font-size:40px;transition:transform .08s}
.keypad button:active{transform:translateY(3px)}
.row-c{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}

/* ---------- farm screen ---------- */
.hud{display:flex;align-items:center;gap:10px;flex:none;flex-wrap:nowrap}
.me{display:flex;align-items:center;gap:10px;background:rgba(255,253,248,.92);border-radius:999px;padding:4px 16px 4px 4px;min-width:0;box-shadow:0 5px 0 var(--line)}
.me .av{width:52px;height:52px;border-radius:50%;background:var(--pink-soft);overflow:hidden;flex:none;display:grid;place-items:center}
.me .av svg{width:50px;height:50px;margin-top:6px}
.me .nm{font-family:var(--f-display);font-size:22px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spacer{flex:1}
.pill{display:flex;align-items:center;gap:8px;min-height:56px;padding:4px 18px 4px 8px;border-radius:999px;background:rgba(255,253,248,.95);box-shadow:0 5px 0 var(--line);font-family:var(--f-display);font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}
.pill svg{width:40px;height:40px;flex:none}
.pill.bump{animation:bounce .4s}
.stage{flex:1;min-height:0;display:flex;gap:14px;align-items:stretch;padding-top:12px}
.guide{width:clamp(130px,17vw,210px);flex:none;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:10px}
.bubble{position:relative;background:var(--card);border:4px solid #fff;border-radius:22px;padding:10px 14px;font-size:17px;line-height:1.35;box-shadow:0 6px 0 var(--line);text-align:center;width:100%;animation:fadeIn .3s}
.bubble::after{content:"";position:absolute;left:50%;bottom:-14px;margin-left:-10px;border:10px solid transparent;border-top-color:#fff;border-bottom:0}
.guide-pr{width:100%;max-height:58%;display:flex;justify-content:center;cursor:pointer}
.guide-pr svg{height:100%;max-height:300px;width:auto;max-width:100%;animation:bob 2.6s ease-in-out infinite;transform-origin:50% 100%}
.guide-pr:active svg{animation:bounce .4s}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.field{flex:1;min-width:0;min-height:0;container-type:size;display:grid;place-items:center}
.plots{--cols:4;--rows:3;width:min(100cqw,calc((100cqh - 24px) * var(--cols) / var(--rows)));aspect-ratio:var(--cols)/var(--rows);display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));grid-template-rows:repeat(var(--rows),minmax(0,1fr));gap:clamp(8px,1.8cqw,18px);padding:clamp(12px,2.2cqw,22px);padding-top:clamp(22px,4cqw,40px);background:var(--meadow-2);border-radius:36px;border:6px solid rgba(255,255,255,.75);box-shadow:inset 0 -8px 0 var(--meadow-3),0 10px 0 rgba(91,58,94,.12);position:relative}
.plot{position:relative;border-radius:22%;background:radial-gradient(ellipse at 50% 35%,var(--soil) 0%,var(--soil-2) 100%);box-shadow:0 6px 0 var(--soil-3),inset 0 4px 0 rgba(255,255,255,.22);transition:transform .1s;min-width:0}
.plot::before{content:"";position:absolute;inset:14%;border-radius:18%;background:repeating-linear-gradient(180deg,rgba(91,50,30,.16) 0 5px,transparent 5px 15px);pointer-events:none}
.plot:active{transform:scale(.96)}
.plot .plant{position:absolute;left:-4%;width:108%;bottom:6%;height:130%;pointer-events:none;overflow:visible}
.plot .plus{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-display);font-size:clamp(26px,4cqw,46px);color:rgba(255,255,255,.75);font-weight:800}
.plot.locked{background:linear-gradient(var(--meadow),var(--meadow-2));box-shadow:0 6px 0 var(--meadow-3);opacity:.85}
.plot.locked::before{display:none}
.plot.locked .lock{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#fff;font-family:var(--f-display);font-size:clamp(13px,1.8cqw,18px)}
.plot.locked .lock svg{width:38%;height:auto}
.badge{position:absolute;top:-10%;right:-8%;width:42%;aspect-ratio:1;max-width:100%;border-radius:50%;display:grid;place-items:center;background:#fff;box-shadow:0 4px 0 rgba(91,58,94,.15);animation:bob 1.6s ease-in-out infinite;z-index:3;pointer-events:none}
.badge svg{width:70%;height:70%}
.growbar{position:absolute;left:16%;right:16%;bottom:8%;height:9px;border-radius:9px;background:rgba(255,255,255,.45);overflow:hidden;z-index:3}
.growbar i{display:block;height:100%;width:0;background:var(--mint);border-radius:9px;transition:width .5s linear}
.sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 3.2s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.ripe-bob{transform-box:fill-box;transform-origin:50% 100%;animation:ripe 1.8s ease-in-out infinite}
@keyframes ripe{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.pop{animation:popgrow .6s cubic-bezier(.3,1.6,.5,1)}
@keyframes popgrow{0%{transform:scale(.4)}100%{transform:scale(1)}}
.rain{position:absolute;inset:-30% 0 20% 0;pointer-events:none;z-index:4}
.rain i{position:absolute;top:0;width:8px;height:14px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:#7fc8ff;animation:drop .7s ease-in forwards;opacity:0}
@keyframes drop{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(160%);opacity:0}}

/* ---------- modal ---------- */
.modal{position:fixed;inset:0;z-index:20;background:var(--shade);display:grid;place-items:center;padding:12px max(12px,env(safe-area-inset-right,0px)) 12px max(12px,env(safe-area-inset-left,0px));backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.modal-card{position:relative;width:100%;max-width:600px;max-height:100%;overflow-y:auto;background:var(--card);border:6px solid #fff;border-radius:34px;box-shadow:0 12px 0 rgba(91,58,94,.18);padding:22px clamp(16px,3.5vw,30px) 24px;display:flex;flex-direction:column;gap:14px;animation:popIn .35s cubic-bezier(.3,1.5,.5,1)}
@keyframes popIn{from{transform:scale(.8);opacity:.001}to{transform:scale(1);opacity:1}}
.modal-card.shake{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.x-btn{position:absolute;top:10px;right:10px;width:48px;height:48px;border-radius:50%;background:var(--pink-soft);display:grid;place-items:center}
.x-btn svg{width:22px;height:22px}
.m-title{font-size:30px;color:var(--pink-2);text-align:center;padding-inline:44px}
.m-sub{text-align:center;color:var(--ink-soft);font-size:17px;margin:-6px 0 0}
.q-head{display:flex;align-items:center;gap:10px}
.chip{font-family:var(--f-display);font-weight:800;font-size:17px;padding:4px 14px;border-radius:999px;letter-spacing:.3px}
.chip-math{background:var(--pink-soft);color:var(--pink-2)}
.chip-eng{background:var(--mint-soft);color:var(--mint-2)}
.chip-count{background:var(--butter);color:var(--gold-2)}
.q-reason{font-size:15px;color:var(--ink-soft);flex:1}
.q-text{font-size:clamp(24px,3.6vw,32px);font-weight:800;text-align:center;line-height:1.25}
.q-text .en{color:var(--mint-2)}
.q-visual{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:8px}
.big-pic{width:132px;height:132px;border-radius:30px;background:var(--lav-soft);display:grid;place-items:center;font-size:84px;line-height:1}
.swatch{display:inline-block;width:62%;aspect-ratio:1;border-radius:50%;border:5px solid #fff;box-shadow:0 4px 0 rgba(91,58,94,.12)}
.listen-btn{width:120px;height:120px;border-radius:50%;background:var(--mint);box-shadow:0 8px 0 var(--mint-2);display:grid;place-items:center;animation:pulse 1.6s ease-in-out infinite}
.listen-btn svg{width:62px;height:62px}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.choices.row{grid-template-columns:repeat(3,minmax(0,1fr))}
.choices.one{grid-template-columns:repeat(2,minmax(0,1fr))}
.choice{min-height:68px;padding:8px 12px;border-radius:22px;background:#fff;border:4px solid var(--line);box-shadow:0 5px 0 var(--line);font-family:var(--f-display);font-size:clamp(22px,3.2vw,30px);font-weight:800;line-height:1.15;transition:transform .08s;overflow-wrap:anywhere}
.choice:active{transform:translateY(3px)}
.choice.pic{min-height:110px;font-size:62px;display:grid;place-items:center}
.choice.pic .swatch{width:64px}
.choice.wrong{background:var(--bad-soft);border-color:var(--bad);box-shadow:0 5px 0 var(--bad);animation:shake .4s;opacity:.7}
.choice.right{background:var(--good);border-color:var(--good);box-shadow:0 5px 0 #2b9a5d;color:#fff;animation:bounce .5s}
.choice.show{border-color:var(--good);box-shadow:0 5px 0 var(--good);background:var(--good-soft)}
.q-feedback{min-height:28px;margin:0;text-align:center;font-size:20px;line-height:1.35}
.q-feedback.good{color:var(--mint-2)}
.q-feedback.hint{color:var(--pink-2)}
.q-actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}
.q-actions:empty{display:none}
.word-blank{font-family:var(--f-display);font-size:clamp(40px,7vw,58px);font-weight:800;letter-spacing:6px;color:var(--ink)}
.word-blank .gap{display:inline-block;min-width:.8em;border-bottom:6px solid var(--pink);color:var(--pink-2)}
.slots{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.slot{width:56px;height:64px;border-radius:16px;background:var(--lav-soft);border:4px dashed var(--lav);display:grid;place-items:center;font-family:var(--f-display);font-size:38px;font-weight:800}
.slot.on{background:#fff;border-style:solid;border-color:var(--lav-2)}
.slot.fixed{background:var(--butter);border-color:var(--gold)}
.tiles{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.tile{width:62px;height:62px;border-radius:18px;background:#fff;box-shadow:0 5px 0 var(--line);font-family:var(--f-display);font-size:38px;font-weight:800;transition:transform .08s,opacity .2s}
.tile[disabled]{opacity:.25;transform:scale(.9)}
.count-grid{display:grid;grid-template-columns:repeat(5,52px);gap:6px;justify-content:center}
.count-grid svg{width:52px;height:52px}
.baskets{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.basket{background:var(--butter);border-radius:24px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.basket .count-grid{grid-template-columns:repeat(3,40px)}
.basket .count-grid svg{width:40px;height:40px}
.basket span{font-size:15px;color:var(--gold-2)}
.cmp{font-family:var(--f-display);font-size:clamp(44px,8vw,64px);font-weight:800;display:flex;gap:16px;align-items:center}
.cmp .q{width:72px;height:72px;border-radius:20px;border:5px dashed var(--pink);color:var(--pink-2);display:grid;place-items:center;font-size:44px}
.vis-svg{width:150px;height:150px}
.emo-row{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;font-size:44px;max-width:380px;line-height:1.1}
.seed-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.seed{border-radius:24px;background:#fff;border:4px solid var(--line);box-shadow:0 5px 0 var(--line);padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;transition:transform .08s;min-width:0}
.seed:active{transform:translateY(3px)}
.seed svg{width:70px;height:70px}

.parent-list{display:flex;flex-direction:column;gap:10px}
.parent-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#fff;border:3px solid var(--line);border-radius:20px;padding:8px 12px}
.parent-row .nm{flex:1;min-width:120px;font-family:var(--f-display);font-size:20px}
.parent-row .code{font-size:26px;letter-spacing:4px}

/* ---------- nav + shared sub-screens ---------- */
.btn svg{width:26px;height:26px}
.nav-btn{display:flex;align-items:center;gap:6px;min-height:56px;padding:4px 18px 4px 8px;border-radius:999px;background:var(--butter);box-shadow:0 5px 0 #efd585;font-family:var(--f-display);font-size:20px;font-weight:800;flex:none;transition:transform .08s}

.nav-btn .ni svg{width:40px;height:40px;display:block}

.mini-say svg{width:22px;height:22px}
.link{color:var(--pink-2);text-decoration:underline;text-underline-offset:3px;font-weight:800;min-height:40px}

.sub-body{flex:1;min-height:0;overflow-y:auto;display:grid;gap:18px;align-content:start;padding:4px 2px 16px}

.shop-body{grid-template-columns:minmax(0,1fr) minmax(0,1.5fr)}

/* ---------- market ---------- */
.stall{background:var(--card);border:5px solid #fff;border-radius:30px;box-shadow:0 8px 0 var(--line);overflow:hidden;align-self:start}
.awning{height:46px;background:repeating-linear-gradient(90deg,var(--pink) 0 36px,#fff 36px 72px);position:relative}
.awning::after{content:"";position:absolute;left:0;right:0;top:100%;height:16px;background:radial-gradient(circle at 18px 0,var(--pink) 17px,transparent 18px) 0 0/72px 16px repeat-x,radial-gradient(circle at 54px 0,#fff 17px,transparent 18px) 0 0/72px 16px repeat-x}

function setSync(m){syncMode=m; const el=$('#sync'); if(!el) return;
 el.textContent = m==='cloud' ? 'Tiến trình được lưu vào tài khoản Claude, chơi máy nào cũng giữ nguyên' : m==='local' ? 'Tiến trình được lưu trên máy này' : 'Đang kiểm tra nơi lưu…';}
function scheduleCloud(){ if(!cloudRef) return; cloudDirty=true; clearTimeout(cloudTimer); cloudTimer=setTimeout(flushCloud,1500); }
async function flushCloud(){
 if(!cloudRef||cloudBusy||!cloudDirty) return;
 cloudBusy=true; cloudDirty=false;
 try{ await cloudRef.set(JSON.parse(JSON.stringify(store))); setSync('cloud'); }
 catch(e){ const c=e&&e.code; if(c==='unavailable'||c==='resource_exhausted'){cloudDirty=true} else {cloudRef=null; setSync('local')} }
 finally{ cloudBusy=false; }
}
function persist(){ store.updatedAt=now(); lsSave(); scheduleCloud(); }
function mergeRemote(remote){
 if(!remote||!remote.profiles) return {changed:false,push:Object.keys(store.profiles).length>0};
 let changed=false, push=false;
 const del=Object.assign({},remote.deleted||{},store.deleted||{});
 for(const id of Object.keys(remote.profiles)){ const rp=remote.profiles[id], lp=store.profiles[id];
   if(!lp||(rp.updatedAt||0)>(lp.updatedAt||0)){store.profiles[id]=rp; changed=true} }
 for(const id of Object.keys(store.profiles)){ const rp=remote.profiles[id], lp=store.profiles[id]; if(!rp||(lp.updatedAt||0)>(rp.updatedAt||0)) push=true; }
 for(const id of Object.keys(del)){ if(store.profiles[id]){delete store.profiles[id]; changed=true} if(remote.profiles[id]) push=true; }
 store.deleted=del;
 if(remote.settings&&!changed&&!push) {}
 return {changed,push};
}

   if(!db||!user){setSync('local');return}
   const uid=await user.id(); if(!uid){setSync('local');return}
   const ref=db.doc('data/users/'+uid+'/farm');
   const snap=await Promise.race([ref.get(),new Promise((_,rej)=>setTimeout(()=>rej({code:'timeout'}),10000))]);
   cloudRef=ref;
   const remote=snap&&snap.exists?JSON.parse(JSON.stringify(snap.data()||{})):null;
   const r=mergeRemote(remote);
   if(r.changed){lsSave(); onStoreChanged();}
   setSync('cloud');
   if(r.push){cloudDirty=true; flushCloud();}
 }catch(e){ cloudRef=null; setSync('local'); }
}

const fx=$('#fx'), fctx=fx.getContext('2d'); let parts=[], fxRun=false;
function sizeFx(){const d=window.devicePixelRatio||1; fx.width=innerWidth*d; fx.height=innerHeight*d; fctx.setTransform(d,0,0,d,0,0)}

const FX_COLS=['#ff86b3','#ffc93c','#8fe3cb','#cbb8f5','#7fc8ff','#ff9a3c','#ffffff'];
function burst(x,y,n){ n=n||40; if(reduced) n=Math.min(n,10);
 for(let i=0;i<n;i++) parts.push({x,y,vx:(Math.random()-.5)*10,vy:-Math.random()*10-3,life:60+rnd(0,40),r:rnd(6,11),c:pick(FX_COLS),rot:Math.random()*6,vr:(Math.random()-.5)*.3,s:pick(['rect','dot','star','star'])});
 if(!fxRun){fxRun=true; requestAnimationFrame(fxLoop)}
}
function star(r){fctx.beginPath(); for(let i=0;i<10;i++){const a=i*Math.PI/5-Math.PI/2, rr=i%2?r*.45:r; fctx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr)} fctx.closePath(); fctx.fill()}
function fxLoop(){
 fctx.clearRect(0,0,innerWidth,innerHeight);
 parts=parts.filter(p=>p.life>0);
 for(const p of parts){ p.vy+=.3; p.x+=p.vx; p.y+=p.vy; p.vx*=.985; p.rot+=p.vr; p.life--;
   fctx.save(); fctx.globalAlpha=Math.min(1,p.life/25); fctx.translate(p.x,p.y); fctx.rotate(p.rot); fctx.fillStyle=p.c;
   if(p.s==='rect') fctx.fillRect(-p.r/2,-p.r/4,p.r,p.r/2); else if(p.s==='dot'){fctx.beginPath();fctx.arc(0,0,p.r/2.4,0,7);fctx.fill()} else star(p.r/1.6);
   fctx.restore(); }
 if(parts.length) requestAnimationFrame(fxLoop); else {fxRun=false; fctx.clearRect(0,0,innerWidth,innerHeight)}
}

function openParent(){

    ${confirmDel===p.id?`<button class="btn small" data-del2="${esc(p.id)}">Xóa hẳn</button><button class="btn soft small" data-nodel="1">Giữ lại</button>`:`<button class="btn soft small" data-del="${esc(p.id)}">Xóa</button>`}</div>`).join(''):'<p class="note">Chưa có hồ sơ nào.</p>'}</div>
  <div class="row-c"><button class="btn mint small" data-exp="1">Xuất dữ liệu</button><label class="btn lav small" style="cursor:pointer">Nhập dữ liệu<input type="file" id="imp" accept="application/json,.json" hidden></label></div>
  <div id="exp-box"></div>
  <p class="q-feedback good" id="par-fb" aria-live="polite"></p>`;
 const draw=()=>{ $('#mcard').innerHTML=`<button class="x-btn" data-act="close" aria-label="Đóng">${ICON.close}</button>`+html(); bindImport(); };
 openModal(html(),{closable:true,onClick:async e=>{
   if(e.target.closest('[data-act="close"]')){closeModal();renderHome();return}
   const d=e.target.closest('[data-del]'); if(d){confirmDel=d.dataset.del; draw(); return}
   if(e.target.closest('[data-nodel]')){confirmDel=null; draw(); return}
   const d2=e.target.closest('[data-del2]'); if(d2){ const id=d2.dataset.del2; delete store.profiles[id]; store.deleted[id]=now(); persist(); confirmDel=null; ps.splice(ps.findIndex(x=>x.id===id),1); draw(); renderHome(); return}
   if(e.target.closest('[data-exp]')) doExport();
 }});
 bindImport();
}
async function doExport(){
 const data=JSON.stringify({app:'princess-farm',v:1,exportedAt:new Date().toISOString(),profiles:store.profiles},null,1);
 const fn='nong-trai-cong-chua-'+new Date().toISOString().slice(0,10)+'.json';
 if(downloadsNS){ try{ const r=await downloadsNS.save({filename:fn,data:new Blob([data],{type:'application/json'})}); if(r&&r.status) $('#par-fb').textContent='Đã lưu file dữ liệu.'; return; }catch(e){ if(e&&e.code==='unavailable') downloadsNS=null; else return; } }
 $('#exp-box').innerHTML=`<p class="note">Sao chép đoạn dữ liệu dưới đây và lưu lại:</p><textarea class="export" readonly>${esc(data)}</textarea>`;
}
function bindImport(){
 const inp=$('#imp'); if(!inp) return;
 inp.addEventListener('change',()=>{
   const f=inp.files&&inp.files[0]; if(!f) return;
   const rd=new FileReader();
   rd.onload=()=>{ try{
       const j=JSON.parse(rd.result); const src=j.profiles||{}; let n=0;
       for(const id of Object.keys(src)){ const p=src[id]; if(p&&p.name&&Array.isArray(p.code)&&Array.isArray(p.plots)){ p.updatedAt=now(); store.profiles[id]=p; delete store.deleted[id]; n++; } }
       persist(); renderHome(); $('#par-fb').textContent = n?`Đã nhập ${n} hồ sơ.`:'File không có hồ sơ hợp lệ.';
     }catch(e){ $('#par-fb').textContent='File không đọc được. Hãy chọn đúng file đã xuất từ trò chơi.'; } };
   rd.readAsText(f);
 });
}

function plotLabel(pl,i,unl){
 if(!unl) return 'Ô đất đang khóa';
 if(!pl.crop) return 'Ô đất trống, chạm để gieo hạt';
 const c=CROPS[pl.crop].vi;
 if(pl.stage>=3) return c+' đã chín, chạm để thu hoạch';
 if(pl.water==='need') return c+' cần tưới nước';
 return c+' đang lớn';
}
function renderPlot(i,anim){
 const p=cur(); const el=document.querySelector(`.plot[data-i="${i}"]`); if(!el) return;
 const pl=p.plots[i], unl=i<p.unlocked;
 el.classList.toggle('locked',!unl);
 el.setAttribute('aria-label',plotLabel(pl,i,unl));
 if(!unl){ el.innerHTML=`<span class="lock">${ICON.lock}<span>Cấp 2</span></span>`; return; }
 if(!pl.crop){ el.innerHTML=`<span class="plus">+</span>`; return; }
 let badge='';
 if(pl.stage>=3) badge=`<span class="badge">${ICON.sparkle}</span>`;
 else if(pl.water==='need') badge=`<span class="badge">${ICON.drop}</span>`;
 const bar = pl.water==='growing' ? `<span class="growbar"><i></i></span>` : '';
 el.innerHTML=plantSVG(pl.crop,pl.stage)+badge+bar;
 if(anim){ const s=el.querySelector('.plant'); if(s){s.classList.add('pop')} }
 updateBar(i);
}
function updateBar(i){
 const p=cur(); const pl=p.plots[i]; if(pl.water!=='growing') return;
 const el=document.querySelector(`.plot[data-i="${i}"] .growbar i`); if(!el) return;
 const f=Math.max(0,Math.min(1,(now()-pl.growStart)/(pl.growAt-pl.growStart)));
 el.style.width=(f*100).toFixed(1)+'%';
}
function updateGuide(){
 const p=cur(); if(!p) return; const pls=p.plots.slice(0,p.unlocked);
 let msg;
 if(pls.some(x=>x.crop&&x.stage>=3)) msg='Có cây chín rồi! Chạm vào cây có ngôi sao để thu hoạch nhé ✨';
 else if(pls.some(x=>x.crop&&x.water==='need')) msg='Cây đang khát nước! Chạm vào cây có giọt nước để tưới nhé 💧';
 else if(!pls.some(x=>x.crop)) msg='Chạm vào ô đất trống có dấu + để gieo hạt nhé 🌱';
 else if(Object.values(p.basket).reduce((a,b)=>a+b,0)>=5) msg='Giỏ nhiều nông sản rồi! Bấm "Ra chợ" để bán lấy xu nhé 🧺';
 else if(Object.keys(OUTFITS).some(id=>!p.owned[id]&&p.coins>=OUTFITS[id].price)) msg='Con đủ xu đổi quà rồi! Bấm "Tiệm quà" xem váy đẹp nhé 🎀';
 else if(pls.some(x=>!x.crop)) msg='Chạm vào ô đất trống có dấu + để gieo hạt nhé 🌱';
 else msg='Cây đang lớn, con chờ một chút nhé! 🌷';
 const b=$('#bubble'); if(b.textContent!==msg){ b.textContent=msg; b.style.animation='none'; void b.offsetWidth; b.style.animation=''; }
}
setInterval(()=>{
 const p=cur(); if(!p||$('#scr-farm').hidden) return;
 let changed=false;
 p.plots.forEach((pl,i)=>{
   if(pl.crop&&pl.water==='growing'){
     if(now()>=pl.growAt){ pl.stage=Math.min(3,pl.stage+1); pl.water=pl.stage>=3?null:'need'; delete pl.growAt; delete pl.growStart; changed=true; renderPlot(i,true); sfx('pop');
       if(pl.stage>=3){ const el=document.querySelector(`.plot[data-i="${i}"]`); if(el){const c=centerOf(el); burst(c.x,c.y-20,18)} } }
     else updateBar(i);
   }
 });
 if(changed){ touch(); updateGuide(); }
},500);

function refreshCoins(){ const p=cur(); if(!p) return; document.querySelectorAll('.coin-n').forEach(e=>e.textContent=p.coins); }
const coinTarget=()=>[...document.querySelectorAll('.coin-pill')].find(e=>e.offsetParent)||$('#pill-coins');

 flyTo(from,tgt,ICON.coin,n,()=>{ refreshCoins(); bump(tgt); });

function onPlotTap(i,el){
 const p=cur(); const pl=p.plots[i];
 if(i>=p.unlocked){ sfx('tap'); toast('Ô đất này sẽ mở khi con lên cấp 2 nhé!'); return; }
 if(!pl.crop){ openSeedPicker(i,el); return; }
 if(pl.stage>=3){ doHarvest(i,el); return; }
 if(pl.water==='need'){ doWater(i,el); return; }
 const s=Math.max(1,Math.ceil((pl.growAt-now())/1000));
 sfx('tap'); toast(`Cây đang lớn, chờ ${s} giây nữa nhé! 🌱`);
}

function doWater(i,el){

const orderText=o=>'I want '+o.lines.map(l=>`${NUM_EN[l.n]} ${cropWord(l.k,l.n)}`).join(' and ')+', please.';
const orderVi=o=>o.lines.map(l=>`${l.n} ${CROPS[l.k].unit} ${CROPS[l.k].vi.toLowerCase()}`).join(' và ');

function renderMarket(){

 $('#mk-goods').innerHTML=Object.keys(SELL).map(k=>{ const c=CROPS[k], n=p.basket[k]||0;
   return `<div class="good">${itemSVG(k)}<span class="vi">${c.vi}</span>

function orderOk(p){ const o=p.order; return !!(o&&o.lines&&o.lines.length&&o.lines.every(l=>(p.basket[l.k]||0)>=l.n)); }
function newOrder(p){
 const avail=Object.keys(SELL).filter(k=>(p.basket[k]||0)>0);
 if(!avail.length){ p.order=null; return; }
 const types=shuffle(avail).slice(0,avail.length>1&&Math.random()<.5?2:1);
 const prev=p.order&&p.order.face; let c; do{ c=pick(CUSTOMERS) }while(c[0]===prev&&CUSTOMERS.length>1);
 p.order={face:c[0],name:c[1],lines:types.map(k=>({k,n:rnd(1,Math.min(5,p.basket[k]))}))};
}

}

 sfx('open');
 openModal(`<h2 class="m-title">Bán ${c.vi.toLowerCase()}</h2>

 {closable:true,onClick:e=>{

/* ================= QUIZ ================= */
function openQuiz(q,done){
 const p=cur(); let tries=0, finished=false;
 const chip={math:['chip-math','Toán'],eng:['chip-eng','Tiếng Anh'],count:['chip-count','Đếm số']}[q.kind];
 const sayBtn=q.say&&!q.autoSay?`<button class="icon-btn" data-sayq="1" aria-label="Nghe từ">${ICON.speaker}</button>`:'';
 let body;
 if(q.spell){
   const letters=q.spell.split(''); let tiles; do{tiles=shuffle(letters.map((c,i)=>({c,i})))}while(letters.length>1&&tiles.map(t=>t.c).join('')===q.spell);
   q._tiles=tiles;
   body=`<div class="slots" id="sp-slots">${letters.map((_,i)=>`<div class="slot" data-s="${i}"></div>`).join('')}</div>
     <div class="tiles" id="sp-tiles">${tiles.map((t,i)=>`<button class="tile" data-t="${i}">${esc(t.c)}</button>`).join('')}</div>
     <div class="row-c"><button class="btn soft small" data-spclear="1">Xếp lại</button></div>`;
 } else {
   body=`<div class="choices ${q.picChoices?'':(q.layout||'')}">${q.choices.map((c,i)=>`<button class="choice ${q.picChoices?'pic':''}" data-i="${i}" ${c.aria?`aria-label="${esc(c.aria)}"`:''}>${c.label}</button>`).join('')}</div>`;
 }
 openModal(`<div class="q-head"><span class="chip ${chip[0]}">${chip[1]}</span><span class="q-reason">${q.reason||''}</span>${sayBtn}</div>
  <h2 class="q-text" ${q.small?'style="font-size:clamp(21px,3vw,26px)"':''}>${q.prompt}</h2>
  ${q.sub?`<p class="m-sub" style="margin:0">${esc(q.sub)}</p>`:''}
  ${q.visual?`<div class="q-visual">${q.visual}</div>`:''}
  ${body}
  <p class="q-feedback" id="q-fb" aria-live="polite"></p>
  <div class="q-actions" id="q-act"></div>`,{onClick});
 if(q.autoSay) setTimeout(()=>sayEn(q.say),350);

 let picked=[], fixed=0;
 function spellRender(){
   const slots=document.querySelectorAll('#sp-slots .slot');
   slots.forEach((s,i)=>{ const t=picked[i]; s.textContent=t!=null?q._tiles[t].c:''; s.classList.toggle('on',t!=null); s.classList.toggle('fixed',i<fixed); });
   document.querySelectorAll('#sp-tiles .tile').forEach(b=>{ b.disabled=picked.includes(+b.dataset.t)||finished; });
 }
 function spellReset(keep){ picked=[]; fixed=keep||0; if(fixed){ const ti=q._tiles.findIndex(t=>t.c===q.spell[0]); picked.push(ti); } spellRender(); }

 function onClick(e){
   if(e.target.closest('[data-sayq]')){ sayEn(q.say); return; }
   if(e.target.closest('[data-cont]')){ closeModal(); finishDone('miss'); return; }
   if(finished) return;
   if(q.spell){
     if(e.target.closest('[data-spclear]')){ spellReset(fixed); return; }
     const t=e.target.closest('.tile'); if(!t||t.disabled) return;
     sfx('tap'); picked.push(+t.dataset.t); spellRender();
     if(picked.length===q.spell.length){
       const w=picked.map(i=>q._tiles[i].c).join('');
       if(w===q.spell) win(); else { tries++; if(tries===1){ sfx('wrong'); shakeCard(); hint(); setTimeout(()=>spellReset(1),500);} else lose(); }
     }
     return;
   }
   const b=e.target.closest('.choice'); if(!b||b.classList.contains('wrong')) return;
   const c=q.choices[+b.dataset.i];
   if(c.value===q.answer){ b.classList.add('right'); win(); }
   else { tries++; b.classList.add('wrong'); sfx('wrong');
     if(tries===1){ hint(); if(q.autoSay) setTimeout(()=>sayEn(q.say),500); }
     else { const rb=[...document.querySelectorAll('.choice')].find(x=>q.choices[+x.dataset.i].value===q.answer); if(rb) rb.classList.add('show'); lose(); } }
 }
 function hint(){ const f=$('#q-fb'); f.className='q-feedback hint'; f.innerHTML='Gần đúng rồi! '+q.hint; }
 function record(res){
   const s=p.stats[q.kind]||(p.stats[q.kind]={t:0,r:0}); s.t++; if(res!=='miss') s.r++;
   if(q.word){ const w=p.words[q.word]||(p.words[q.word]={s:0,r:0}); w.s++; if(res==='first') w.r++; }
 }
 function win(){
   finished=true; const res=tries===0?'first':'second'; record(res); sfx('right');
   const reward=(q.rewards||[5,3,1])[res==='first'?0:1];
   const f=$('#q-fb'); f.className='q-feedback good'; f.innerHTML=`${pick(PRAISE)}${reward?` +${reward} xu`:''}` + (q.kind==='eng'?` · <b class="en">${q.after||''}</b>`:'');
   const c=centerOf($('#mcard')); burst(c.x,c.y-60,46);
   if(q.after) setTimeout(()=>sayEn(q.after),300);
   if(q.spell) spellRender();
   setTimeout(()=>{ const from=centerOf($('#mcard')); closeModal(); addCoins(reward,from); finishDone(res); }, q.after?1900:1400);
 }
 function lose(){
   finished=true; record('miss'); sfx('wrong');
   if(q.spell){ const used=new Set(); picked=q.spell.split('').map(ch=>{const ti=q._tiles.findIndex((t,j)=>t.c===ch&&!used.has(j)); used.add(ti); return ti;}); fixed=q.spell.length; spellRender(); }
   const f=$('#q-fb'); f.className='q-feedback'; f.innerHTML=`Không sao đâu! ${q.explain}`;
   if(q.after) setTimeout(()=>sayEn(q.after),300);
   $('#q-act').innerHTML=`<button class="btn mint" data-cont="1">Con hiểu rồi!</button>`;
 }
 function finishDone(res){ if(res==='miss'){ addCoins((q.rewards||[5,3,1])[2],{x:innerWidth/2,y:innerHeight/2}); } done(res); }
 if(q.spell) spellReset(0);
}

/* ================= GLOBAL EVENTS ================= */
document.addEventListener('pointerdown',()=>{ac()},{once:true});
document.addEventListener('click',e=>{
 if(modalOpen&&e.target.closest('#modal')) return;
 const t=e.target.closest('[data-act]'); if(!t) return;
 const act=t.dataset.act;
 switch(act){
  case 'new': sfx('tap'); openCreate(); break;
  case 'pick': sfx('tap'); openLogin(t.dataset.id); break;
  case 'home': sfx('tap'); renderHome(); show('scr-home'); break;
  case 'av': sfx('tap'); draft.avatar=+t.dataset.i; document.querySelectorAll('#avpick button').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.i===draft.avatar))); break;
  case 'new-key': if(draft.code.length<3){ sfx('tap'); draft.code.push(t.dataset.e); renderDraftCode(); } break;
  case 'new-clear': sfx('tap'); draft.code=[]; renderDraftCode(); break;
  case 'create': { const name=$('#in-name').value.trim().slice(0,14); if(!name||draft.code.length!==3) return;
    const p=newProfile(name,draft.avatar,draft.code.slice()); toast('Nhớ mật mã của con nhé: '+p.code.join(' ')); enterFarm(p.id); break; }
  case 'parent': sfx('tap'); adultGate(openParent); break;
  case 'plot': onPlotTap(+t.dataset.i,t); break;
  case 'basket': openBasket(); break;
  case 'market': openMarket(); break;
  case 'shop': openShop(); break;
  case 'back-farm': sfx('tap'); show('scr-farm'); renderFarm(); break;
  case 'say': sayEn(t.dataset.w); break;
  case 'sell': if(!t.disabled) openSell(t.dataset.k); break;
  case 'say-order': { const p=cur(); if(p&&p.order) sayEn(orderText(p.order)); break; }
  case 'order-prep': openOrderPrep(); break;
  case 'order-skip': { const p=cur(); sfx('tap'); newOrder(p); touch(); renderOrder(); if(p.order) setTimeout(()=>sayEn('Hello! '+orderText(p.order)),200); break; }
  case 'tab': sfx('tap'); shopSlot=t.dataset.slot; shopSel=null; renderShop(); break;
  case 'gift': { sfx('tap'); shopSel=t.dataset.id; renderShop(); sayEn(OUTFITS[shopSel].en); break; }
  case 'gift-buy': buyGift(); break;
  case 'gift-wear': { const p=cur(), it=OUTFITS[shopSel]; p.wear[it.slot]=shopSel; touch(); sfx('pop'); const c=centerOf($('#sh-pr')); burst(c.x,c.y,30); renderShop(); break; }
  case 'gift-off': { const p=cur(), it=OUTFITS[shopSel]; delete p.wear[it.slot]; touch(); sfx('tap'); renderShop(); break; }
  case 'sound': store.settings.sound=store.settings.sound===false; persist(); renderHud(); sfx('tap'); break;
  case 'switch': sfx('tap'); if(cloudDirty){clearTimeout(cloudTimer); flushCloud();} curId=null; renderHome(); show('scr-home'); break;
  case 'guide': { const msg=$('#bubble').textContent; const svg=t.querySelector('svg'); if(svg){svg.style.animation='none'; void svg.getBoundingClientRect(); svg.style.animation='';} if(!sayVi(msg.replace(/[^\p{L}\p{N}\s,.!?]/gu,''))) bump($('#bubble')); break; }
 }
});
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&modalOpen){ const x=$('#mcard .x-btn'); if(x) x.click(); } });

document.querySelectorAll('.coin-ico').forEach(e=>e.innerHTML=ICON.coin); $('#basket-ico').innerHTML=ICON.basket;
$('#ico-market').innerHTML=ICON.market; $('#ico-gift').innerHTML=ICON.gift;
document.querySelectorAll('.back-ico').forEach(e=>e.innerHTML=ICON.home);
document.querySelector('[data-act="switch"]').innerHTML=ICON.home;
renderHome(); setSync('checking');
initCloud();
})();
</script>
