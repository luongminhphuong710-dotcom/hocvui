<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Công chúa nhỏ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800&display=swap">
<style>
/* Bố cục: công chúa bên trái (dính khi cuộn), bên phải là bản đồ các chặng, màn làm bài, tiệm và tủ đồ. Điện thoại: xếp dọc, khi làm bài công chúa thu nhỏ thành dải trên cùng để bé vẫn thấy nhân vật nhảy múa. */
:root {
  --bg: #FDEFF6; --card: #FFFFFF; --ink: #3B1F4A; --ink2: #7A5C8A;
  --rose: #F0509A; --rose-d: #C42D78; --lilac: #8E6CEF; --lilac-l: #EEE8FF;
  --gold: #F5B63A; --gold-d: #8F5A0E; --mint: #1FA97F; --mint-l: #DDF6EE;
  --coral: #E5503F; --coral-l: #FFE5E1; --line: #F2D4E4; --sky: #E8F6FF;
  --s-toan: #F0509A; --s-tv: #1FA97F; --s-ta: #2C83DB;
  --f-display: 'Baloo 2', 'Nunito', 'Segoe UI', system-ui, sans-serif;
  --f-body: 'Nunito', 'Segoe UI', system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); }
body { color: var(--ink); font-family: var(--f-body); font-size: 16px; font-weight: 600; line-height: 1.45; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--lilac); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.app { max-width: 1060px; margin: 0 auto; padding-block: 12px 32px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.top { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
.brand { display: flex; align-items: center; gap: 9px; min-width: 0; font-family: var(--f-display); font-weight: 800; font-size: clamp(1.2rem, 5vw, 1.7rem); color: var(--rose-d); line-height: 1; }
.brand svg { width: 38px; height: 38px; flex: none; }
.hud { display: flex; gap: 8px; align-items: center; flex: none; }
.gems { display: flex; align-items: center; gap: 5px; background: var(--card); border: 3px solid var(--lilac); border-radius: 999px; padding: 3px 13px 3px 7px; font-family: var(--f-display); font-weight: 800; font-size: 1.3rem; color: var(--lilac); font-variant-numeric: tabular-nums; }
.gem { width: 25px; height: 25px; flex: none; }
.gems.bump { animation: bump .5s; }
.icon-btn { width: 46px; height: 46px; border-radius: 50%; border: 3px solid var(--line); background: var(--card); color: var(--ink); display: grid; place-items: center; flex: none; }
.icon-btn svg { width: 22px; height: 22px; }
.icon-btn[aria-pressed="false"] { color: var(--ink2); background: #F6EEF3; }

.layout { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 880px) { .layout { grid-template-columns: minmax(0, 320px) minmax(0, 1fr); align-items: start; gap: 22px; } }

.stage { background: var(--card); border-radius: 28px; border: 3px solid #fff; box-shadow: 0 10px 28px rgba(142, 108, 239, .2); overflow: hidden; position: relative; }
.stage-art { display: flex; justify-content: center; background: #E7D9FF; }
.stage-art svg { display: block; height: clamp(290px, 50vh, 520px); width: auto; max-width: 100%; aspect-ratio: 240 / 420; }
.stage-foot { padding: 9px 14px 11px; display: grid; gap: 6px; justify-items: center; }
#pname { width: 100%; max-width: 260px; text-align: center; font-family: var(--f-display); font-weight: 800; font-size: 1.22rem; color: var(--rose-d); border: 0; border-bottom: 3px dashed var(--line); background: transparent; padding: 2px 6px; border-radius: 0; }
#pname::placeholder { color: #C9A9BC; }
.trynote { font-size: .9rem; font-weight: 800; color: var(--lilac); background: var(--lilac-l); border-radius: 999px; padding: 2px 12px; }
@media (min-width: 880px) { .stage { position: sticky; top: 12px; } }
.app[data-view="quiz"] .tabs { display: none; }
@media (max-width: 879px) {
  .app[data-view="quiz"] .stage-art { height: 150px; overflow: hidden; align-items: flex-start; }
  .app[data-view="quiz"] .stage-art svg { height: 300px; }
  .app[data-view="quiz"] .stage-foot { display: none; }
  .app[data-view="quiz"] .stage { border-radius: 22px; }
}
.fx { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.spark { position: absolute; width: 12px; height: 12px; border-radius: 50%; animation: pop .85s ease-out forwards; }

.tabs { display: flex; gap: 4px; background: var(--lilac-l); padding: 5px; border-radius: 20px; margin-bottom: 14px; }
.tab { flex: 1; min-height: 48px; border: 0; background: transparent; border-radius: 15px; font-family: var(--f-display); font-weight: 700; font-size: clamp(.8rem, 3.2vw, 1.05rem); color: var(--ink2); padding: 4px 3px; }
.tab[aria-selected="true"] { background: var(--card); color: var(--rose-d); box-shadow: 0 3px 0 rgba(142, 108, 239, .22); }

h2.hello { margin: 0; font-family: var(--f-display); font-weight: 800; font-size: clamp(1.45rem, 5.6vw, 1.95rem); line-height: 1.15; text-wrap: balance; }
.lede { margin: 4px 0 14px; color: var(--ink2); }

/* --- Bản đồ --- */
.mapwrap { position: relative; border-radius: 26px; overflow: hidden; border: 3px solid #fff; box-shadow: 0 8px 24px rgba(90, 140, 90, .22); }
.mapwrap > svg { display: block; width: 100%; height: auto; }
.node { position: absolute; transform: translate(-50%, -50%); display: grid; justify-items: center; gap: 3px; background: none; border: 0; padding: 0; width: 23%; }
.ncircle { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; font-family: var(--f-display); font-weight: 800; font-size: 1.3rem; color: #fff; background: var(--rose); border: 4px solid #fff; box-shadow: 0 4px 10px rgba(59, 31, 74, .3); }
.node.locked .ncircle { background: #B6AFC4; }
.node.done .ncircle { background: var(--mint); }
.node.cur .ncircle { animation: beat 1.6s ease-in-out infinite; }
.ncircle svg { width: 24px; height: 24px; }
.nlabel { font-family: var(--f-display); font-weight: 800; font-size: .76rem; line-height: 1.1; color: var(--ink); background: rgba(255, 255, 255, .92); border-radius: 10px; padding: 2px 6px; text-align: center; box-shadow: 0 2px 5px rgba(59, 31, 74, .15); }
.node.locked .nlabel { color: #6A6279; }
.nstars { display: flex; gap: 1px; }
.nstars svg { width: 11px; height: 11px; }
.mapme { position: absolute; transform: translate(-50%, -100%); width: 17%; pointer-events: none; animation: bob 2.4s ease-in-out infinite; }
.mapme svg { display: block; width: 100%; height: auto; filter: drop-shadow(0 3px 4px rgba(59, 31, 74, .3)); }
.maphint { display: flex; align-items: center; gap: 8px; background: var(--card); border: 3px solid var(--line); border-radius: 18px; padding: 8px 14px; margin-bottom: 10px; font-weight: 700; }
.maphint b { font-family: var(--f-display); color: var(--rose-d); }

/* --- Bảng chặng --- */
.stagecard { background: var(--card); border: 3px solid var(--line); border-radius: 26px; padding: 16px; }
.stagecard .intro { color: var(--ink2); margin: 2px 0 12px; }
.tasks { display: grid; gap: 10px; }
.task { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 12px; text-align: left; width: 100%; background: #FBF6FA; border: 3px solid var(--line); border-radius: 20px; padding: 10px 12px; min-height: 68px; }
.task.boss { background: linear-gradient(100deg, #FFF3D1, #FFE0EF 70%); border-color: #F3C98B; }
.task.done { background: var(--mint-l); border-color: #9ADDC4; }
.task.locked { opacity: .62; }
.tnum { width: 40px; height: 40px; border-radius: 14px; display: grid; place-items: center; background: var(--rose); color: #fff; font-family: var(--f-display); font-weight: 800; font-size: 1.2rem; flex: none; }
.task.boss .tnum { background: linear-gradient(135deg, #F5B63A, #F0509A); }
.task.done .tnum { background: var(--mint); }
.task.locked .tnum { background: #B6AFC4; }
.tnum svg { width: 22px; height: 22px; }
.tbody { min-width: 0; }
.tname { font-family: var(--f-display); font-weight: 800; font-size: 1.08rem; line-height: 1.2; }
.tmeta { font-size: .85rem; color: var(--ink2); }
.tright { display: grid; justify-items: end; gap: 2px; }
.tright .nstars svg { width: 15px; height: 15px; }
.subjpills { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 3px; }
.pill { font-size: .72rem; font-weight: 800; padding: 1px 8px; border-radius: 999px; color: #fff; background: var(--sc); }

/* --- Làm bài --- */
.qtop { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 10px 0 10px; }
.back { border: 3px solid var(--line); background: var(--card); border-radius: 999px; padding: 6px 15px; font-weight: 800; min-height: 44px; }
.dots { display: flex; gap: 7px; }
.dot { width: 15px; height: 15px; border-radius: 50%; background: #EBDDE6; }
.dot.cur { background: var(--rose); box-shadow: 0 0 0 4px #FFD3E6; }
.dot.first { background: var(--gold); box-shadow: inset 0 0 0 2px #E39B13; }
.dot.second { background: #BDEBD9; box-shadow: inset 0 0 0 2px var(--mint); }
.dot.miss { background: #FFC9C2; box-shadow: inset 0 0 0 2px var(--coral); }
.qcard { background: var(--card); border: 3px solid var(--line); border-radius: 26px; padding: 16px 14px; text-align: center; }
.qlead { margin: 0 0 6px; font-size: .84rem; font-weight: 800; letter-spacing: .07em; text-transform: uppercase; color: var(--sc, var(--lilac)); }
.qtext { margin: 0 0 14px; font-family: var(--f-display); font-weight: 800; font-size: clamp(2rem, 9vw, 3.1rem); line-height: 1.15; text-wrap: balance; overflow-wrap: anywhere; }
.qtext.long { font-family: var(--f-body); font-weight: 800; font-size: clamp(1.12rem, 4.4vw, 1.42rem); line-height: 1.5; text-align: left; }
.blank { display: inline-block; width: 1.5em; height: 1.1em; border: 3px dashed var(--rose); border-radius: 10px; vertical-align: -.18em; margin-inline: .12em; }
.clock { display: grid; place-items: center; margin: 0 0 8px; }
.clock svg { width: min(50vw, 180px); height: auto; }
.shapes { display: flex; flex-wrap: wrap; justify-content: center; gap: 7px; margin: 0 0 12px; }
.shapes svg { width: 34px; height: 34px; }
.swatch { width: min(44vw, 150px); height: 72px; border-radius: 18px; margin: 0 auto 12px; border: 4px solid #fff; box-shadow: 0 0 0 3px var(--line); }
.opts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.opts.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.opts.row { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.opt { min-height: 64px; border: 3px solid var(--lilac); background: var(--lilac-l); border-radius: 20px; font-family: var(--f-display); font-weight: 800; font-size: clamp(1.05rem, 4.4vw, 1.45rem); line-height: 1.2; padding: 8px 9px; box-shadow: 0 5px 0 #CFC0F5; text-wrap: balance; overflow-wrap: anywhere; }
.opts.row .opt, .opts.big .opt { font-size: clamp(1.5rem, 7vw, 2.2rem); }
.opt:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 2px 0 #CFC0F5; }
.opt.wrong { background: var(--coral-l); border-color: var(--coral); box-shadow: none; opacity: .75; animation: shake .4s; }
.opt.right { background: var(--mint-l); border-color: var(--mint); box-shadow: none; }
.ans { display: flex; align-items: baseline; justify-content: center; gap: 10px; min-height: 76px; padding: 6px 14px; border: 3px dashed var(--rose); border-radius: 20px; background: #FFF6FA; font-family: var(--f-display); font-weight: 800; font-size: 2.5rem; line-height: 1.5; }
.ans .unit { font-family: var(--f-body); font-size: 1.05rem; color: var(--ink2); }
.ans.right { border-style: solid; border-color: var(--mint); background: var(--mint-l); }
.ans.reveal { border-style: solid; border-color: var(--gold); background: #FFF6DC; }
.pad { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; max-width: 330px; margin: 12px auto 0; }
.key { min-height: 56px; border: 3px solid var(--lilac); background: var(--lilac-l); border-radius: 18px; font-family: var(--f-display); font-weight: 800; font-size: 1.65rem; box-shadow: 0 4px 0 #CFC0F5; }
.key:active { transform: translateY(3px); box-shadow: 0 1px 0 #CFC0F5; }
.key.del { background: var(--coral-l); border-color: #F3A79C; box-shadow: 0 4px 0 #F6C8C1; font-size: 1.35rem; }
.key.go { background: var(--mint); border-color: #168564; color: #fff; box-shadow: 0 4px 0 #168564; font-size: 1.15rem; }
.fb { margin-top: 12px; border-radius: 18px; padding: 12px 14px; display: grid; gap: 2px; text-align: left; border: 3px solid transparent; }
.fb b { font-family: var(--f-display); font-size: 1.12rem; display: inline-flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.fb .gem { width: 21px; height: 21px; }
.fb .sol { font-weight: 800; }
.fb.ok { background: var(--mint-l); border-color: #9ADDC4; }
.fb.no { background: var(--coral-l); border-color: #F3A79C; }
.fb.info { background: #FFF6DC; border-color: #F2D58B; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; padding: 8px 20px; border-radius: 999px; border: 3px solid var(--line); background: var(--card); font-family: var(--f-display); font-weight: 800; font-size: 1.1rem; text-wrap: balance; }
.btn.primary { background: var(--rose); border-color: var(--rose-d); color: #fff; box-shadow: 0 5px 0 var(--rose-d); }
.btn.primary:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--rose-d); }
.btn.block { width: 100%; margin-top: 12px; }
.btns { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 16px; }

.result { background: var(--card); border: 3px solid var(--line); border-radius: 26px; padding: 20px 16px; text-align: center; }
.result h2 { margin: 0; font-family: var(--f-display); font-weight: 800; font-size: 1.85rem; color: var(--rose-d); text-wrap: balance; }
.result h2.fail { color: var(--ink2); }
.stars { display: flex; justify-content: center; flex-wrap: wrap; gap: 7px; margin: 12px 0 6px; }
.stars svg { width: 40px; height: 40px; }
.earn { display: inline-flex; align-items: center; gap: 8px; font-family: var(--f-display); font-weight: 800; font-size: 2.2rem; color: var(--lilac); }
.earn .gem { width: 38px; height: 38px; }
.note { margin: 6px 0 0; color: var(--ink2); }
.note.up { color: var(--mint); font-weight: 800; }

/* --- Luyện tập --- */
.subjhead { display: flex; align-items: center; gap: 8px; margin: 16px 0 8px; font-family: var(--f-display); font-weight: 800; font-size: 1.25rem; }
.subjhead i { width: 14px; height: 14px; border-radius: 50%; background: var(--sc); }
.topics { display: grid; grid-template-columns: repeat(auto-fill, minmax(158px, 1fr)); gap: 11px; }
.topic { display: grid; gap: 2px; justify-items: start; text-align: left; background: var(--card); border: 3px solid var(--line); border-radius: 22px; padding: 11px 13px; box-shadow: 0 5px 0 var(--line); min-height: 142px; transition: transform .12s; }
.topic:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--line); }
.ti { width: 44px; height: 44px; border-radius: 15px; background: var(--sc); color: #fff; display: grid; place-items: center; font-family: var(--f-display); font-weight: 800; font-size: 1.7rem; line-height: 1; margin-bottom: 5px; }
.ti svg { width: 27px; height: 27px; }
.tn { font-family: var(--f-display); font-weight: 800; font-size: 1.1rem; line-height: 1.15; }
.ts { font-size: .84rem; color: var(--ink2); line-height: 1.3; }
.lv { display: flex; gap: 4px; margin-top: auto; padding-top: 7px; align-items: center; font-size: .78rem; font-weight: 800; color: var(--ink2); }
.lv i { width: 11px; height: 11px; border-radius: 50%; background: #EBDDE6; }
.lv i.on { background: var(--gold); box-shadow: inset 0 0 0 2px #E39B13; }

/* --- Tiệm, tủ đồ --- */
.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 10px; }
.chip { flex: none; min-height: 44px; padding: 6px 15px; border: 3px solid var(--line); background: var(--card); border-radius: 999px; font-family: var(--f-display); font-weight: 700; font-size: 1rem; }
.chip[aria-pressed="true"] { background: var(--rose); border-color: var(--rose-d); color: #fff; }
.items { display: grid; grid-template-columns: repeat(auto-fill, minmax(142px, 1fr)); gap: 11px; }
.item { background: var(--card); border: 3px solid var(--line); border-radius: 22px; padding: 8px 8px 10px; display: grid; gap: 4px; text-align: center; align-content: start; }
.item.worn { border-color: var(--mint); background: #F4FCF9; }
.item.trying { border-color: var(--lilac); background: #F7F3FF; }
.thumb { border: 0; border-radius: 16px; background: linear-gradient(#F4ECFF, #FFE8F3); padding: 4px; display: grid; place-items: center; height: 128px; }
.thumb svg { max-width: 100%; max-height: 100%; width: auto; height: 100%; }
.iname { font-family: var(--f-display); font-weight: 800; font-size: 1rem; line-height: 1.15; min-height: 2.3em; display: grid; place-items: center; text-wrap: balance; }
.btn.small { min-height: 44px; font-size: .98rem; padding: 4px 11px; width: 100%; box-shadow: none; }
.btn.small.buy { background: var(--gold); border-color: #D9981A; color: #4A2D00; }
.btn.small.buy.poor { background: #F7EEF3; border-color: var(--line); color: var(--ink2); }
.btn.small.on { background: var(--mint-l); border-color: var(--mint); color: #0E6A4F; }
.btn.small .gem { width: 19px; height: 19px; }
.sect { margin: 18px 0 8px; font-family: var(--f-display); font-weight: 800; font-size: 1.18rem; }
.swatches { display: flex; flex-wrap: wrap; gap: 10px; }
.sw { width: 46px; height: 46px; border-radius: 50%; border: 4px solid #fff; box-shadow: 0 0 0 3px var(--line); background: var(--c); }
.sw[aria-pressed="true"] { box-shadow: 0 0 0 4px var(--rose); }
.empty { color: var(--ink2); padding: 8px 2px; }

/* --- Mốc chiến thắng --- */
.mstrip { display: flex; align-items: center; gap: 10px; background: linear-gradient(100deg, #FFF3D1, #FFE0EF 70%, #EDE3FF); border: 3px solid #fff; box-shadow: 0 5px 0 #F1C9E0; border-radius: 22px; padding: 10px 14px; margin-bottom: 12px; }
.mstrip .mnum { font-family: var(--f-display); font-weight: 800; font-size: 1.6rem; color: var(--gold-d); font-variant-numeric: tabular-nums; }
.mbar { height: 14px; border-radius: 999px; background: #fff; overflow: hidden; box-shadow: inset 0 0 0 2px #F1C9E0; }
.mbar i { display: block; height: 100%; border-radius: 999px; background: linear-gradient(90deg, #F5B63A, #F0509A); }
.mstrip .grow { flex: 1; min-width: 0; display: grid; gap: 3px; }
.mstrip .cap { font-size: .84rem; font-weight: 800; color: var(--gold-d); }
.celebrate { position: fixed; inset: 0; z-index: 40; background: rgba(59, 31, 74, .62); display: grid; place-items: center; padding: 18px; overflow: auto; }
.cbox { background: var(--card); border-radius: 28px; border: 5px solid var(--gold); max-width: 440px; width: 100%; padding: 22px 18px; text-align: center; position: relative; }
.cbox h2 { margin: 6px 0 0; font-family: var(--f-display); font-weight: 800; font-size: 1.9rem; color: var(--rose-d); text-wrap: balance; }
.cbox .big { font-family: var(--f-display); font-weight: 800; font-size: 3rem; color: var(--gold-d); line-height: 1.1; }
.gift { width: 108px; height: 108px; margin: 0 auto; display: block; }
.milist { display: grid; gap: 8px; margin-top: 8px; }
.mirow { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; background: #FBF6FA; border: 3px solid var(--line); border-radius: 18px; padding: 9px 11px; }
.mirow.given { background: var(--mint-l); border-color: #9ADDC4; }
.mirow .mi { width: 36px; height: 36px; border-radius: 12px; background: var(--gold); color: #4A2D00; display: grid; place-items: center; font-family: var(--f-display); font-weight: 800; }
.mirow input[type="text"] { width: 100%; border: 0; border-bottom: 2px dashed var(--line); background: transparent; font: inherit; font-size: .95rem; padding: 2px 2px; }
.mirow .when { font-size: .78rem; color: var(--ink2); }
.tick { min-height: 44px; padding: 4px 12px; border-radius: 999px; border: 3px solid var(--line); background: #fff; font-weight: 800; font-size: .9rem; white-space: nowrap; }
.tick[aria-pressed="true"] { background: var(--mint); border-color: #168564; color: #fff; }

/* --- Phụ huynh --- */
.parent { background: var(--card); border: 3px solid var(--line); border-radius: 26px; padding: 16px; }

<script>
/* ===== Bộ sinh câu hỏi Toán lớp 2 ===== */
const R = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = a => a[R(0, a.length - 1)];
function shuffle(a) {
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = R(0, i); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function numOpts(ans, min = 0, max = 999) {
  const s = new Set([ans]);
  const cand = [ans + 1, ans - 1, ans + 2, ans - 2, ans + 10, ans - 10, ans + 5, ans - 5, ans + 11, ans - 11];
  if (ans >= 10 && ans < 100) { const t = Math.floor(ans / 10), u = ans % 10; if (t !== u) cand.unshift(u * 10 + t); }
  for (const c of shuffle(cand)) { if (s.size >= 4) break; if (c >= min && c <= max) s.add(c); }
  let k = 1;
  while (s.size < 4 && k < 50) { if (ans + k <= max) s.add(ans + k); if (s.size < 4 && ans - k >= min) s.add(ans - k); k++; }
  return shuffle([...s]);
}
function num(topic, lead, text, answer, solution, hint, extra) {
  return Object.assign({ topic, type: 'num', lead, text, answer, solution, hint, unit: '' }, extra || {});
}
function mc(topic, lead, text, answer, options, solution, hint, extra) {
  return Object.assign({ topic, type: 'mc', lead, text, answer: String(answer), options: options.map(String), solution, hint }, extra || {});
}

/* ---- Cộng ---- */
function gCong(L) {
  const T = 'cong';
  if (L === 1) {
    const a0 = R(0, 8), b0 = R(1, 9 - a0), a1 = R(1, 5), b1 = R(0, 4);
    const a = a1 * 10 + a0, b = b1 * 10 + b0;
    return num(T, 'Tính', `${a} + ${b} = ?`, a + b, `${a} + ${b} = ${a + b}`, 'Cộng hàng đơn vị trước, rồi cộng hàng chục.');
  }
  if (L === 2) {
    const a0 = R(2, 9), b0 = R(10 - a0, 9), a1 = R(1, 6), b1 = R(1, 8 - a1);
    const a = a1 * 10 + a0, b = b1 * 10 + b0;
    return num(T, 'Tính (có nhớ)', `${a} + ${b} = ?`, a + b, `${a} + ${b} = ${a + b}`, `Hàng đơn vị: ${a0} + ${b0} = ${a0 + b0}, viết ${(a0 + b0) % 10} nhớ 1 sang hàng chục.`);
  }
  if (Math.random() < 0.5) {
    const a = R(10, 40), b = R(5, 30), c = R(5, Math.min(40, 100 - a - b));
    return num(T, 'Tính', `${a} + ${b} + ${c} = ?`, a + b + c, `${a} + ${b} = ${a + b}; ${a + b} + ${c} = ${a + b + c}`, 'Cộng hai số đầu trước, rồi cộng với số còn lại.');
  }
  const x = R(15, 60), y = R(15, 99 - x);
  const left = Math.random() < 0.5;
  return num(T, 'Tìm số còn thiếu', left ? `? + ${x} = ${x + y}` : `${x} + ? = ${x + y}`, y, `${x + y} − ${x} = ${y}`, 'Lấy tổng trừ đi số đã biết.');
}

/* ---- Trừ ---- */
function gTru(L) {
  const T = 'tru';
  if (L === 1) {
    const a1 = R(2, 9), a0 = R(1, 9), b1 = R(0, a1 - 1);
    let b0 = R(0, a0); if (b1 === 0 && b0 === 0) b0 = 1;
    const a = a1 * 10 + a0, b = b1 * 10 + b0;
    return num(T, 'Tính', `${a} − ${b} = ?`, a - b, `${a} − ${b} = ${a - b}`, 'Trừ hàng đơn vị trước, rồi trừ hàng chục.');
  }
  if (L === 2) {
    const a0 = R(0, 7), b0 = R(a0 + 1, 9), a1 = R(2, 9), b1 = R(0, a1 - 1);
    const a = a1 * 10 + a0, b = b1 * 10 + b0;
    return num(T, 'Tính (có nhớ)', `${a} − ${b} = ?`, a - b, `${a} − ${b} = ${a - b}`, `${a0} không trừ được ${b0}, mượn 1 chục: ${a0 + 10} − ${b0} = ${a0 + 10 - b0}.`);
  }
  const k = pick(['hundred', 'three', 'miss1', 'miss2']);
  if (k === 'hundred') {
    const x = R(11, 99);
    return num(T, 'Tính', `100 − ${x} = ?`, 100 - x, `100 − ${x} = ${100 - x}`, '100 là 10 chục. Hãy trừ từng bước.');
  }
  if (k === 'three') {
    const a = R(50, 99), b = R(5, 25), c = R(5, Math.min(25, a - b - 1));
    return num(T, 'Tính', `${a} − ${b} − ${c} = ?`, a - b - c, `${a} − ${b} = ${a - b}; ${a - b} − ${c} = ${a - b - c}`, 'Trừ lần lượt từ trái sang phải.');
  }
  if (k === 'miss1') {
    const b = R(10, 50), r = R(10, 99 - b);
    return num(T, 'Tìm số còn thiếu', `? − ${b} = ${r}`, b + r, `${r} + ${b} = ${b + r}`, 'Số bị trừ bằng hiệu cộng số trừ.');
  }
  const a = R(30, 99), r = R(10, a - 10);
  return num(T, 'Tìm số còn thiếu', `${a} − ? = ${r}`, a - r, `${a} − ${r} = ${a - r}`, 'Số trừ bằng số bị trừ trừ đi hiệu.');
}

/* ---- Nhân chia ---- */
function gNhanChia(L) {
  const T = 'nhanchia';
  const tables = L === 1 ? [2, 5] : L === 2 ? [3, 4] : [2, 3, 4, 5];
  const t = pick(tables), k = R(1, 10), p = t * k;
  const hint = `Đếm thêm ${t}: ${[1, 2, 3, 4, 5].map(i => t * i).join(', ')}...`;
  const kinds = L < 3 ? ['mul', 'div'] : ['mul', 'div', 'miss'];
  const kind = pick(kinds);
  if (kind === 'mul') return num(T, 'Tính', `${t} × ${k} = ?`, p, `${t} × ${k} = ${p}`, hint);
  if (kind === 'div') return num(T, 'Tính', `${p} : ${t} = ?`, k, `${p} : ${t} = ${k}`, hint);
  return Math.random() < 0.5
    ? num(T, 'Tìm số còn thiếu', `? × ${t} = ${p}`, k, `${p} : ${t} = ${k}`, hint)
    : num(T, 'Tìm số còn thiếu', `${t} × ? = ${p}`, k, `${p} : ${t} = ${k}`, hint);
}

/* ---- So sánh, số và dãy số ---- */
function gSoSanh(L) {
  const T = 'sosanh';
  const k = pick(L === 1 ? ['place', 'cmp', 'next'] : L === 2 ? ['expr', 'order', 'seq'] : ['seq2', 'fact', 'mul']);
  const SYM = ['<', '=', '>'];
  const sym = (a, b) => (a > b ? '>' : a < b ? '<' : '=');
  if (k === 'place') {
    let t, u;
    do { t = R(1, 9); u = R(0, 9); } while (t === u);
    const n = t * 10 + u, ans = `${t} chục ${u} đơn vị`;
    const others = [`${u} chục ${t} đơn vị`, `${t} chục ${(u + 1) % 10} đơn vị`, `${(t % 9) + 1} chục ${u} đơn vị`, `${t} chục ${(u + 9) % 10} đơn vị`];
    const opts = shuffle([ans, ...shuffle(others).slice(0, 3)]);
    return mc(T, 'Chọn đáp án đúng', `Số ${n} gồm:`, ans, opts, `${n} = ${t} chục + ${u} đơn vị`, 'Chữ số bên trái là hàng chục, chữ số bên phải là hàng đơn vị.');
  }
  if (k === 'cmp') {
    const a = R(10, 99), b = Math.random() < 0.2 ? a : R(10, 99);
    return mc(T, 'Chọn dấu thích hợp', `${a} __ ${b}`, sym(a, b), SYM, `${a} ${sym(a, b)} ${b}`, 'So sánh chữ số hàng chục trước. Nếu bằng nhau thì so sánh hàng đơn vị.', { row: true });
  }
  if (k === 'next') {
    const after = Math.random() < 0.5, n = R(11, 98);
    const ans = after ? n + 1 : n - 1;
    return mc(T, 'Chọn đáp án đúng', `Số liền ${after ? 'sau' : 'trước'} của ${n} là:`, ans, numOpts(ans, 1, 120), `Số liền ${after ? 'sau' : 'trước'} của ${n} là ${ans}`, after ? 'Số liền sau hơn số đó 1 đơn vị.' : 'Số liền trước kém số đó 1 đơn vị.');
  }
  if (k === 'expr') {
    const x = R(10, 50), y = R(5, 40), v = x + y;
    const z = R(v + 3, Math.min(99, v + 30));
    const w = Math.random() < 0.25 ? z - v : z - v + pick([-2, -1, 1, 2, 3, 4, 5]);
    const v2 = z - w, s = sym(v, v2);
    return mc(T, 'Chọn dấu thích hợp', `${x} + ${y} __ ${z} − ${w}`, s, SYM, `${x} + ${y} = ${v} và ${z} − ${w} = ${v2}, nên ${v} ${s} ${v2}`, 'Tính hai vế trước, rồi so sánh kết quả.', { row: true });
  }
  if (k === 'order') {
    const set = new Set();
    while (set.size < 4) set.add(R(10, 99));
    const arr = [...set], big = Math.random() < 0.5;
    const ans = big ? Math.max(...arr) : Math.min(...arr);
    return mc(T, 'Chọn đáp án đúng', `Số nào ${big ? 'lớn' : 'bé'} nhất?`, ans, arr, `${arr.join(', ')} → ${ans} là số ${big ? 'lớn' : 'bé'} nhất`, 'So sánh chữ số hàng chục trước.');
  }
  if (k === 'seq') {
    const d = pick([2, 5, 10]), s = d === 2 ? R(1, 20) : d * R(1, 4);
    const t = [0, 1, 2, 3].map(i => s + i * d), ans = s + 4 * d;
    return num(T, 'Điền số tiếp theo', `${t.join(', ')}, ?`, ans, `${t.join(', ')}, ${ans} (mỗi số hơn số trước ${d})`, `Hai số liền nhau hơn kém nhau ${d}.`);
  }
  if (k === 'seq2') {
    const d = pick([2, 3, 4, 5, 10]), s = R(2, Math.min(30, 99 - 4 * d)), p = R(1, 3);
    const t = [0, 1, 2, 3, 4].map(i => s + i * d), ans = t[p];
    const shown = t.map((v, i) => (i === p ? '?' : v));
    return num(T, 'Điền số còn thiếu', shown.join(', '), ans, `${t.join(', ')} (mỗi số hơn số trước ${d})`, `Hai số liền nhau hơn kém nhau ${d}.`);
  }
  if (k === 'fact') {
    const f = pick([
      ['Số lớn nhất có hai chữ số là:', 99, [90, 98, 99, 100]],
      ['Số bé nhất có hai chữ số là:', 10, [0, 1, 10, 11]],
      ['Số tròn chục lớn nhất có hai chữ số là:', 90, [80, 90, 99, 100]]
    ]);
    return mc(T, 'Chọn đáp án đúng', f[0], f[1], shuffle(f[2]), `${f[0]} ${f[1]}`, 'Số có hai chữ số nằm từ 10 đến 99.');
  }
  const a = pick([2, 3, 4, 5]), b = R(2, 9), v = a * b, c = Math.max(1, v + pick([-3, -2, -1, 0, 1, 2, 3]));
  return mc(T, 'Chọn dấu thích hợp', `${a} × ${b} __ ${c}`, sym(v, c), SYM, `${a} × ${b} = ${v}, nên ${v} ${sym(v, c)} ${c}`, 'Tính phép nhân trước, rồi so sánh.', { row: true });
}

/* ---- Đồng hồ ---- */
function gDongHo(L) {
  const T = 'dongho';
  if (L === 3 && Math.random() < 0.2) {
    return Math.random() < 0.5
      ? num(T, 'Điền số', '1 giờ = ? phút', 60, '1 giờ = 60 phút', 'Kim dài đi hết một vòng là 1 giờ.')
      : num(T, 'Điền số', '1 ngày có ? giờ', 24, '1 ngày có 24 giờ', 'Một ngày gồm ban ngày và ban đêm.');
  }
  const mins = L === 1 ? [0] : L === 2 ? [0, 30] : [0, 15, 30];
  const h = R(1, 12), m = pick(mins), nh = h % 12 + 1, ph = h === 1 ? 12 : h - 1;
  const lab = (hh, mm) => (mm ? `${hh} giờ ${mm} phút` : `${hh} giờ`);
  const ans = lab(h, m);
  let pool;
  if (L === 1) {
    const rest = shuffle([...Array(12)].map((_, i) => i + 1).filter(x => x !== h && x !== nh));
    pool = [lab(nh, 0), lab(rest[0], 0), lab(rest[1], 0)];
  } else {
    const all = [];
    [h, nh, ph].forEach(hh => mins.forEach(mm => { if (!(hh === h && mm === m)) all.push(lab(hh, mm)); }));
    pool = shuffle(all).slice(0, 3);
  }
  return mc(T, 'Chọn đáp án đúng', 'Đồng hồ chỉ mấy giờ?', ans, shuffle([ans, ...pool]), `Đồng hồ chỉ ${ans}`,
    'Kim ngắn chỉ giờ, kim dài chỉ phút. Kim dài chỉ số 12 là giờ đúng, chỉ số 3 là 15 phút, chỉ số 6 là 30 phút.', { clock: { h, m } });
}

/* ---- Đo lường và hình học ---- */
function gDoLuong(L) {
  const T = 'doluong';
  if (L === 1) {
    const n = R(1, 9), k = pick(['a', 'b', 'c']);
    if (k === 'a') return num(T, 'Điền số', `${n} dm = ? cm`, n * 10, `${n} dm = ${n * 10} cm`, '1 dm = 10 cm.');
    if (k === 'b') return num(T, 'Điền số', `${n * 10} cm = ? dm`, n, `${n * 10} cm = ${n} dm`, '10 cm = 1 dm.');
    return num(T, 'Điền số', '1 m = ? dm', 10, '1 m = 10 dm', '1 m = 10 dm = 100 cm.');
  }
  if (L === 2) {
    const k = pick(['m-dm', 'm-cm', 'kg', 'l']);
    if (k === 'm-dm') { const n = R(1, 5); return num(T, 'Điền số', `${n} m = ? dm`, n * 10, `${n} m = ${n * 10} dm`, '1 m = 10 dm.'); }

function makeRound(topicId, levels, n = 5) {
  const out = [], seen = new Set();
  let guard = 0;
  while (out.length < n && guard++ < 200) {
    const t = topicId === 'tonghop' ? pick(TOPICS) : TOPICS.find(x => x.id === topicId);
    const q = t.gen(levels[t.id] || 1);
    const key = q.text + (q.clock ? q.clock.h + ':' + q.clock.m : '');
    if (seen.has(key)) continue;
    seen.add(key);
    out.push(q);
  }
  return out;
}

  const t = q.text.replace(/__/g, ' dấu gì ').replace(/(^|[\s=,])\?/g, ' bao nhiêu ').replace(/×/g, ' nhân ')
    .replace(/−/g, ' trừ ').replace(/\+/g, ' cộng ').replace(/ : /g, ' chia ').replace(/=/g, ' bằng ')
    .replace(/>/g, ' lớn hơn ').replace(/</g, ' bé hơn ');
  speak(q.lead + '. ' + t, 'vi-VN');
}
const calm = () => { try { return matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { return false; } };
const MOVES = ['m-jump', 'm-twirl', 'm-dance', 'm-wave', 'm-fly'];
let moveT = 0;
function moveP(name) {
  const a = $('stageArt');
  if (!a || calm()) return;
  const has = S.worn.wings;
  const m = name || pick(has ? MOVES : MOVES.filter(x => x !== 'm-fly'));
  MOVES.forEach(x => a.classList.remove(x));
  void a.offsetWidth; a.classList.add(m);
  clearTimeout(moveT); moveT = setTimeout(() => a.classList.remove(m), 1400);
}
function burst() {
  if (calm()) return;
  const fx = $('fx'), cols = ['#F5B63A', '#F0509A', '#8E6CEF', '#ffffff'];
  for (let i = 0; i < 16; i++) {
    const s = document.createElement('i'), a = Math.random() * 6.283, d = 60 + Math.random() * 100;
    s.className = 'spark';
    s.style.setProperty('--dx', Math.cos(a) * d + 'px'); s.style.setProperty('--dy', Math.sin(a) * d - 20 + 'px');
    s.style.left = '50%'; s.style.top = '42%'; s.style.background = pick(cols);
    fx.appendChild(s); setTimeout(() => s.remove(), 900);
  }
}
let toastT = 0;
function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2800);
}

/* --- tiến trình bản đồ --- */
const pkey = (si, ti) => si + '-' + ti;
const starsOf = (si, ti) => S.prog[pkey(si, ti)] || 0;
const passedT = (si, ti) => starsOf(si, ti) >= needStars(STAGES[si].tasks[ti]);
const stageOpen = si => si === 0 || passedT(si - 1, 2);
const taskOpen = (si, ti) => stageOpen(si) && (ti === 0 || passedT(si, ti - 1));
function curStage() { let i = 0; while (i < STAGES.length - 1 && passedT(i, 2)) i++; return i; }
function curTask(si) { let t = 0; while (t < 2 && passedT(si, t)) t++; return t; }
const allDone = () => passedT(STAGES.length - 1, 2);
function subjOf(ids) { const s = []; ids.forEach(i => { const x = byId(i).subject; if (!s.includes(x)) s.push(x); }); return s; }

/* --- hiển thị chung --- */
function renderHud(bump) {
  $('gemCount').textContent = S.gems;
  if (bump && !calm()) { const g = $('gems'); g.classList.remove('bump'); void g.offsetWidth; g.classList.add('bump'); }
  $('soundBtn').setAttribute('aria-pressed', String(S.sound));
  $('soundWave').style.display = S.sound ? '' : 'none';
}
function renderStage() {
  const worn = Object.assign({}, S.worn, U.preview);
  $('stageArt').innerHTML = princessSVG({ worn, skin: S.skin, hair: S.hair });
  $('tryNote').hidden = !Object.keys(U.preview).length;
}
function render() {
  document.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === U.tab)));
  $('app').dataset.view = U.quiz ? 'quiz' : U.tab;
  const v = $('view');
  if (U.quiz) v.innerHTML = quizHTML();
  else if (U.result) v.innerHTML = resultHTML();
  else if (U.tab === 'map') v.innerHTML = U.stage === null ? mapHTML() : stageHTML();
  else if (U.tab === 'play') v.innerHTML = menuHTML();
  else if (U.tab === 'shop') v.innerHTML = shopHTML();
  else if (U.tab === 'closet') v.innerHTML = closetHTML();
  else v.innerHTML = parentHTML();
  $('overlay').innerHTML = U.celebrate ? celebrateHTML() : '';
  if (U.quiz && U.quiz.done) { const n = $('nextBtn'); if (n) n.focus({ preventScroll: true }); }
  if (U.tab === 'map' && U.stage === null && U.scrollMap) {
    U.scrollMap = false;
    const n = curStage() > 0 ? document.querySelector('.node.cur') : null;
    if (n) setTimeout(() => { try { n.scrollIntoView({ block: 'center', behavior: 'smooth' }); } catch (e) { /* bỏ qua */ } }, 80);
  }
}
function go(tab) {
  if (tab !== 'shop' && Object.keys(U.preview).length) { U.preview = {}; renderStage(); }
  U.tab = tab; U.quiz = null; U.result = null; U.stage = null; U.confirmReset = false; U.celebrate = null;
  if (tab === 'map') U.scrollMap = true;
  render(); window.scrollTo({ top: 0 });
}

/* --- Bản đồ --- */
function mapHTML() {
  const cs = curStage(), done = allDone();
  let nodes = '';
  STAGES.forEach((s, i) => {
    const open = stageOpen(i), fin = passedT(i, 2), cur = i === cs && !done;
    const st = fin ? 'done' : open ? (cur ? 'cur' : '') : 'locked';
    const stars = [0, 1, 2].map(t => STAR(passedT(i, t))).join('');
    const inner = fin ? (i === STAGES.length - 1 ? CROWN : CHECK) : open ? (i + 1) : LOCK;
    nodes += `<button class="node ${st}" style="left:${(s.x / MAPW * 100).toFixed(2)}%;top:${(s.y / MAPH * 100).toFixed(2)}%" ${open ? '' : 'disabled'} data-act="stage" data-i="${i}" aria-label="Chặng ${i + 1}: ${esc(s.name)}${open ? '' : ' (chưa mở)'}">
<span class="ncircle" aria-hidden="true">${inner}</span><span class="nlabel">${esc(s.name)}</span><span class="nstars" aria-hidden="true">${stars}</span></button>`;
  });
  const me = STAGES[cs];
  const mx = me.x > 200 ? me.x - 54 : me.x + 54;
  const meHTML = `<div class="mapme" style="left:${(mx / MAPW * 100).toFixed(2)}%;top:${((me.y + 16) / MAPH * 100).toFixed(2)}%" aria-hidden="true">${princessSVG({ worn: S.worn, skin: S.skin, hair: S.hair }, { plain: true, view: '20 30 200 376' })}</div>`;
  const hint = done
    ? `<div class="maphint"><span>${CROWN.replace('fill="#fff"', 'fill="#F5B63A"').replace('<svg', '<svg style="width:26px;height:26px"')}</span><span>Con đã đi hết vương quốc. Chọn lại bất kỳ chặng nào để chơi tiếp nhé!</span></div>`
    : `<div class="maphint"><span>📍</span><span>Con đang ở <b>${esc(me.name)}</b>. Vượt qua <b>${esc(me.boss)}</b> để mở chặng tiếp theo.</span></div>`;
  return `<h2 class="hello">Vương quốc thông minh</h2><p class="lede">Mỗi chặng có 2 thử thách và 1 chướng ngại vật. Trả lời đúng để lấy kim cương và mở đường đi tiếp.</p>
${milestoneStrip()}${hint}
<div class="mapwrap"><svg viewBox="0 0 ${MAPW} ${MAPH}" role="img" aria-label="Bản đồ vương quốc thông minh">${mapSVG()}
<path d="${pathD()}" fill="none" stroke="#F0E2C2" stroke-width="15" stroke-linecap="round"/>
<path d="${pathD()}" fill="none" stroke="#D7BE8E" stroke-width="15" stroke-linecap="round" stroke-dasharray="2 21"/></svg>${nodes}${meHTML}</div>`;
}

/* --- Bảng một chặng --- */
function stageHTML() {
  const si = U.stage, s = STAGES[si];
  let h = `<div class="qtop"><button class="back" data-act="map">‹ Bản đồ</button><div class="nstars" aria-hidden="true" style="gap:3px">${[0, 1, 2].map(t => STAR(passedT(si, t))).join('')}</div></div>
<section class="stagecard"><h2 class="hello">Chặng ${si + 1}: ${esc(s.name)}</h2><p class="intro">${esc(s.intro)}</p><div class="tasks">`;
  s.tasks.forEach((t, ti) => {
    const open = taskOpen(si, ti), ok = passedT(si, ti), need = needStars(t), n = qCount(t);
    const st = ok ? 'done' : open ? '' : 'locked';
    const icon = ok ? CHECK : open ? (t.boss ? '⚔' : ti + 1) : LOCK;
    const pills = subjOf(t.t).map(x => `<span class="pill" style="--sc:${SUBJ[x].c}">${SUBJ[x].name}</span>`).join('');
    const meta = t.boss ? `Chướng ngại vật · ${n} câu · cần ${need} sao` : `${n} câu · cần ${need} sao`;
    h += `<button class="task ${t.boss ? 'boss' : ''} ${st}" ${open ? '' : 'disabled'} data-act="task" data-i="${si}" data-t="${ti}">
<span class="tnum" aria-hidden="true">${icon}</span>
<span class="tbody"><span class="tname">${esc(t.n)}</span><span class="tmeta">${meta}</span><span class="subjpills">${pills}</span></span>
<span class="tright"><span class="nstars" aria-hidden="true">${Array.from({ length: n }, (_, i) => STAR(i < starsOf(si, ti))).join('')}</span></span></button>`;
  });
  return h + '</div></section>';
}

/* --- Luyện tập tự do --- */
const pips = l => [1, 2, 3].map(i => `<i class="${i <= l ? 'on' : ''}"></i>`).join('');
function menuHTML() {
  const nm = S.name.trim();
  let h = `<h2 class="hello">Luyện tập cùng ${nm ? esc(nm) : 'công chúa'}</h2><p class="lede">Chọn môn con muốn luyện. Mỗi lượt 5 câu, đúng ngay lần đầu được 3 kim cương, đúng ở lần thứ hai được 1 kim cương.</p>`;
  ['toan', 'tv', 'ta'].forEach(sj => {
    h += `<h3 class="subjhead" style="--sc:${SUBJ[sj].c}"><i></i>${SUBJ[sj].name}</h3><div class="topics">`;
    ALL.filter(t => t.subject === sj).forEach(t => {
      h += `<button class="topic" data-act="free" data-id="${t.id}" style="--sc:${SUBJ[sj].c}" aria-label="${t.name}, ${t.sub}, mức ${lvl(t.id)} trên 3">
<span class="ti">${TICON[t.id]}</span><span class="tn">${esc(t.name)}</span><span class="ts">${esc(t.sub)}</span><span class="lv" aria-hidden="true">${pips(lvl(t.id))}</span></button>`;
    });
    h += '</div>';

/* --- Làm bài --- */
function clockSVG(h, m) {
  let t = '', k = '';
  for (let i = 1; i <= 12; i++) { const a = i * Math.PI / 6; t += `<text x="${f1(60 + 41 * Math.sin(a))}" y="${f1(60 - 41 * Math.cos(a) + 5)}" text-anchor="middle" font-size="14" font-weight="800" fill="#3B1F4A" font-family="'Baloo 2',sans-serif">${i}</text>`; }
  for (let i = 0; i < 60; i++) { const a = i * Math.PI / 30, r1 = i % 5 ? 55 : 52; k += `<line x1="${f1(60 + r1 * Math.sin(a))}" y1="${f1(60 - r1 * Math.cos(a))}" x2="${f1(60 + 57 * Math.sin(a))}" y2="${f1(60 - 57 * Math.cos(a))}" stroke="#C9A9BC" stroke-width="${i % 5 ? 1 : 2}"/>`; }
  const ha = (h % 12) * 30 + m * 0.5, ma = m * 6;
  return `<svg viewBox="0 0 120 120" role="img" aria-label="Đồng hồ"><circle cx="60" cy="60" r="58" fill="#fff" stroke="#F0509A" stroke-width="4"/>${k}${t}<line x1="60" y1="60" x2="60" y2="38" stroke="#C42D78" stroke-width="5.5" stroke-linecap="round" transform="rotate(${ha} 60 60)"/><line x1="60" y1="60" x2="60" y2="24" stroke="#8E6CEF" stroke-width="3.5" stroke-linecap="round" transform="rotate(${ma} 60 60)"/><circle cx="60" cy="60" r="4" fill="#3B1F4A"/></svg>`;
}
const PAD = `<div class="pad">${[1, 2, 3, 4, 5, 6, 7, 8, 9].map(n => `<button class="key" data-act="key" data-k="${n}">${n}</button>`).join('')}<button class="key del" data-act="key" data-k="del" aria-label="Xóa số vừa nhập">⌫</button><button class="key" data-act="key" data-k="0">0</button><button class="key go" data-act="key" data-k="go">Xong</button></div>`;
const PRAISE = ['Giỏi quá!', 'Tuyệt vời!', 'Chính xác!', 'Công chúa thông minh quá!', 'Đúng rồi!', 'Xuất sắc!'];

function startQuiz(cfg) {
  U.result = null;
  U.quiz = Object.assign({ i: 0, tries: 0, done: false, earned: 0, input: '', wrong: new Set(), results: [], notes: [], shake: false, lastOk: false, lastGain: 0, praise: '' },
    cfg, { qs: buildRound(cfg.topics, cfg.n) });
  render(); window.scrollTo({ top: 0 });
  autoSay();
}
function autoSay() {
  const Q = U.quiz;
  if (!Q || !S.sound) return;
  const q = Q.qs[Q.i];
  if (q && q.en) setTimeout(() => speak(q.en, 'en-US'), 220);
}
function quizHTML() {
  const Q = U.quiz, q = Q.qs[Q.i], last = Q.i === Q.qs.length - 1;
  const sc = SUBJ[byId(q.topic).subject].c;
  const dots = Q.qs.map((_, i) => `<span class="dot ${i < Q.i ? Q.results[i] : i === Q.i ? 'cur' : ''}"></span>`).join('');
  const long = q.text.length > 26;
  const txt = esc(q.text).replace('__', '<span class="blank" aria-label="chỗ trống"></span>');
  let extra = '';
  if (q.clock) extra += `<div class="clock">${clockSVG(q.clock.h, q.clock.m)}</div>`;
  if (q.swatch) extra += `<div class="swatch" style="background:${q.swatch}" role="img" aria-label="Ô màu"></div>`;
  if (q.shapes) extra += `<div class="shapes" role="img" aria-label="${q.shapes.n} hình">${Array.from({ length: q.shapes.n }, () => SHP[q.shapes.kind]()).join('')}</div>`;
  let ans;
  if (q.type === 'mc') {
    ans = `<div class="opts ${q.row ? 'row' : q.three ? 'three' : ''} ${q.big ? 'big' : ''}">` + q.options.map(o => {
      const st = Q.done && o === q.answer ? 'right' : Q.wrong.has(o) ? 'wrong' : '';
      return `<button class="opt ${st}" data-act="opt" data-v="${esc(o)}" ${Q.done || Q.wrong.has(o) ? 'disabled' : ''}>${esc(o)}</button>`;
    }).join('') + '</div>';
  } else {
    const shown = Q.done ? String(q.answer) : Q.input;
    ans = `<div class="ans ${Q.shake ? 'shake' : ''} ${Q.done ? (Q.lastOk ? 'right' : 'reveal') : ''}" aria-live="polite"><span>${shown || '&nbsp;'}</span>${q.unit ? `<span class="unit">${esc(q.unit)}</span>` : ''}</div>` + (Q.done ? '' : PAD);
  }
  const ansText = q.type === 'num' ? q.answer + (q.unit ? ' ' + q.unit : '') : q.answer;
  let fb = '';
  if (Q.done) {
    fb = Q.lastOk
      ? `<div class="fb ok"><b>${Q.praise}${Q.lastGain ? ` +${Q.lastGain} ${GEM}` : ''}</b><span class="sol">${esc(q.solution)}</span></div>`
      : `<div class="fb info"><b>Đáp án đúng là ${esc(ansText)}</b><span class="sol">${esc(q.solution)}</span><span>Lần sau mình sẽ làm được nhé!</span></div>`;
  } else if (Q.tries === 1) {
    fb = `<div class="fb no"><b>Chưa đúng rồi, thử lại nhé!</b><span class="sol">Gợi ý: ${esc(q.hint)}</span></div>`;
  }
  const sayBtn = canSpeak() ? `<button class="icon-btn" data-act="say" aria-label="Đọc to câu hỏi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/></svg></button>` : '<span></span>';
  const html = `<div class="qtop"><button class="back" data-act="exit">‹ Thoát</button><div class="dots" role="img" aria-label="Câu ${Q.i + 1} trên ${Q.qs.length}">${dots}</div>${sayBtn}</div>
<article class="qcard" style="--sc:${sc}"><p class="qlead">${esc(q.lead)}</p>${extra}<p class="qtext ${long ? 'long' : ''}">${txt}</p>${ans}</article>
<div aria-live="polite">${fb}</div>${Q.done ? `<button class="btn primary block" id="nextBtn" data-act="next">${last ? 'Xem kết quả' : 'Câu tiếp theo'}</button>` : ''}`;
  Q.shake = false;
  return html;
}
function submit(val) {
  const Q = U.quiz, q = Q.qs[Q.i];
  if (!Q || Q.done) return;
  const ok = q.type === 'num' ? Number(val) === q.answer : val === q.answer;
  if (ok) return finishQ(true);
  Q.tries++; sfx.no();
  if (q.type === 'mc') Q.wrong.add(val); else { Q.input = ''; Q.shake = true; }
  if (Q.tries >= 2) finishQ(false); else render();
}
function finishQ(ok) {
  const Q = U.quiz, q = Q.qs[Q.i], first = ok && Q.tries === 0;
  Q.done = true; Q.lastOk = ok; Q.lastGain = first ? 3 : ok ? 1 : 0; Q.praise = pick(PRAISE);
  Q.earned += Q.lastGain; addGems(Q.lastGain);
  Q.results.push(first ? 'first' : ok ? 'second' : 'miss');
  const st = S.stats[q.topic] || (S.stats[q.topic] = { n: 0, ok: 0 });
  st.n++; if (first) st.ok++;
  const sk = S.streak[q.topic] || (S.streak[q.topic] = { up: 0, down: 0 }), nm = byId(q.topic).name;
  if (first) {
    sk.up++; sk.down = 0;
    if (sk.up >= 3 && lvl(q.topic) < 3) { S.levels[q.topic] = lvl(q.topic) + 1; sk.up = 0; Q.notes.push(`${nm}: lên Mức ${lvl(q.topic)} rồi!`); }
  } else if (!ok) {
    sk.down++; sk.up = 0;
    if (sk.down >= 2 && lvl(q.topic) > 1) { S.levels[q.topic] = lvl(q.topic) - 1; sk.down = 0; }
  }
  save(); renderHud(Q.lastGain > 0);
  if (ok) { sfx.ok(); burst(); moveP(); } else moveP('m-dance');
  render();
}
function addGems(n) { if (!n) return; S.gems += n; S.total += n; }
function checkMilestone() {
  const want = Math.floor(S.total / 100);
  if (want > S.milestones.length) {
    const m = { n: S.milestones.length + 1, date: new Date().toISOString().slice(0, 10), gift: '', given: false };
    S.milestones.push(m); save();
    U.celebrate = m; sfx.win(); burst(); moveP('m-twirl');
    return true;
  }
  return false;
}
function nextQ() {
  const Q = U.quiz;
  if (Q.i < Q.qs.length - 1) { Q.i++; Q.tries = 0; Q.done = false; Q.input = ''; Q.wrong = new Set(); render(); window.scrollTo({ top: 0 }); autoSay(); return; }
  const firsts = Q.results.filter(r => r === 'first').length;
  const perfect = firsts === Q.qs.length, bonus = perfect ? 5 : 0;
  addGems(bonus); S.rounds++;
  let unlocked = null, passed = true;
  if (Q.stage != null) {
    const t = STAGES[Q.stage].tasks[Q.task];
    passed = firsts >= needStars(t);
    if (firsts > starsOf(Q.stage, Q.task)) S.prog[pkey(Q.stage, Q.task)] = firsts;
    if (passed && Q.task === 2 && Q.stage + 1 < STAGES.length) unlocked = STAGES[Q.stage + 1];
  }
  save(); renderHud(true);
  U.result = { topics: Q.topics, title: Q.title, stage: Q.stage, task: Q.task, earned: Q.earned + bonus, bonus, firsts, total: Q.qs.length, notes: Q.notes, passed, unlocked };
  U.quiz = null;
  sfx.done(); burst(); moveP(passed ? 'm-jump' : 'm-wave');
  render(); window.scrollTo({ top: 0 });
  checkMilestone();
  if (U.celebrate) render();
}

/* --- Kết quả --- */
function nudge() {
  const next = ITEMS.filter(i => !S.owned.includes(i.id)).sort((a, b) => a.price - b.price)[0];
  if (!next) return 'Con đã sưu tầm đủ mọi món đồ trong tiệm. Giỏi quá!';
  return S.gems >= next.price ? `Con đủ kim cương để mua ${next.name} rồi!` : `Cần thêm ${next.price - S.gems} kim cương để mua ${next.name}.`;
}
function resultHTML() {
  const r = U.result, inStage = r.stage != null;
  const t = inStage ? STAGES[r.stage].tasks[r.task] : null;
  const stars = Array.from({ length: r.total }, (_, i) => STAR(i < r.firsts)).join('');
  let head, note = '';
  if (inStage && r.passed) {
    head = t.boss ? `Vượt qua ${esc(t.n)}!` : 'Qua thử thách!';
    if (r.unlocked) note = `<p class="note up">Mở chặng mới: ${esc(r.unlocked.name)}</p>`;
    else if (t.boss) note = `<p class="note up">Con đã tới lâu đài. Cả vương quốc chúc mừng công chúa!</p>`;
  } else if (inStage) {
    head = 'Chưa qua, thử lại nhé!';
    note = `<p class="note">Cần ${needStars(t)} sao để qua. Kim cương con vừa kiếm vẫn được giữ nguyên.</p>`;
  } else head = 'Hoàn thành!';
  return `<section class="result"><h2 class="${inStage && !r.passed ? 'fail' : ''}">${head}</h2>
<div class="stars" role="img" aria-label="Đúng ngay lần đầu ${r.firsts} trên ${r.total} câu">${stars}</div>
<p class="note">Đúng ngay lần đầu ${r.firsts} trên ${r.total} câu</p>
<div class="earn">+${r.earned} ${GEM}</div>${r.bonus ? '<p class="note up">Thưởng thêm 5 kim cương vì đúng hết cả lượt!</p>' : ''}
${r.notes.map(n => `<p class="note up">${esc(n)}</p>`).join('')}${note}
<p class="note">${esc(nudge())}</p>
<div class="btns">${inStage
    ? `<button class="btn primary" data-act="retry">${r.passed ? 'Chơi lại' : 'Thử lại'}</button><button class="btn" data-act="stageback" data-i="${r.stage}">Về chặng</button><button class="btn" data-act="map">Bản đồ</button>`
    : `<button class="btn primary" data-act="retry">Chơi tiếp</button><button class="btn" data-act="goshop">Vào tiệm</button><button class="btn" data-act="play">Chọn môn khác</button>`}</div></section>`;
}

/* --- Mốc chiến thắng --- */
function milestoneStrip() {
  const got = S.milestones.length, inBar = S.total % 100, left = 100 - inBar;
  return `<div class="mstrip"><span class="mnum">${got}</span><span class="grow">
<span class="cap">${got ? `Đã đạt ${got} mốc chiến thắng` : 'Mốc chiến thắng đầu tiên'} · còn ${left} kim cương nữa</span>
<span class="mbar"><i style="width:${inBar}%"></i></span></span>${GEM}</div>`;
}
function celebrateHTML() {
  const m = U.celebrate;
  return `<div class="celebrate" role="dialog" aria-modal="true" aria-label="Mốc chiến thắng"><div class="cbox">
${GIFT}<p class="big">Mốc ${m.n}</p><h2>Công chúa đã có ${m.n * 100} kim cương!</h2>
<p class="note">Con vừa đạt một mốc chiến thắng. Mẹ sẽ tặng con một món quà bất ngờ nhé!</p>
<div class="btns"><button class="btn primary" data-act="closecb">Tuyệt vời!</button></div></div></div>`;
}

/* --- Tiệm và tủ đồ --- */
function catChips() {
  return `<div class="chips" role="group" aria-label="Loại đồ">${CATS.map(c => `<button class="chip" data-act="cat" data-id="${c.id}" aria-pressed="${U.cat === c.id}">${c.name}</button>`).join('')}</div>`;
}
function shopHTML() {
  const cat = CATS.find(c => c.id === U.cat);
  let h = `<h2 class="hello">Tiệm thời trang</h2><p class="lede">Chạm vào món đồ để mặc thử, thích thì mua bằng kim cương.</p>${catChips()}<div class="items">`;
  ITEMS.filter(i => i.cat === U.cat).forEach(i => {
    const owned = S.owned.includes(i.id), worn = S.worn[i.cat] === i.id, trying = U.preview[i.cat] === i.id;
    let act;
    if (owned) act = worn ? (cat.req ? `<button class="btn small on" disabled>Đang mặc</button>` : `<button class="btn small on" data-act="unwear" data-id="${i.cat}">Cởi ra</button>`) : `<button class="btn small" data-act="wear" data-id="${i.id}">Mặc</button>`;
    else act = `<button class="btn small buy ${S.gems >= i.price ? '' : 'poor'}" data-act="buy" data-id="${i.id}" aria-label="Mua ${esc(i.name)}, giá ${i.price} kim cương">Mua ${GEM} ${i.price}</button>`;
    h += `<div class="item ${worn ? 'worn' : ''} ${trying ? 'trying' : ''}"><button class="thumb" data-act="try" data-id="${i.id}" aria-label="Mặc thử ${esc(i.name)}">${thumbSVG(i, S)}</button><div class="iname">${esc(i.name)}</div>${act}</div>`;
  });
  return h + '</div>';
}
function closetHTML() {
  const cat = CATS.find(c => c.id === U.cat), mine = ITEMS.filter(i => i.cat === U.cat && S.owned.includes(i.id));
  let h = `<h2 class="hello">Tủ đồ</h2><p class="lede">Chọn đồ để mặc cho công chúa.</p>${catChips()}<div class="items">`;
  if (!cat.req) h += `<div class="item ${S.worn[U.cat] ? '' : 'worn'}"><div class="thumb" aria-hidden="true"></div><div class="iname">Không đeo</div><button class="btn small ${S.worn[U.cat] ? '' : 'on'}" data-act="unwear" data-id="${U.cat}">${S.worn[U.cat] ? 'Chọn' : 'Đang chọn'}</button></div>`;
  mine.forEach(i => {
    const worn = S.worn[i.cat] === i.id;
    h += `<div class="item ${worn ? 'worn' : ''}"><button class="thumb" data-act="wear" data-id="${i.id}" aria-label="Mặc ${esc(i.name)}">${thumbSVG(i, S)}</button><div class="iname">${esc(i.name)}</div><button class="btn small ${worn ? 'on' : ''}" data-act="wear" data-id="${i.id}" ${worn ? 'disabled' : ''}>${worn ? 'Đang mặc' : 'Mặc'}</button></div>`;
  });
  h += '</div>';
  if (!mine.length) h += `<p class="empty">${cat.req ? 'Chưa có món nào. Vào tiệm để mua nhé!' : 'Con chưa mua món nào ở mục này. Vào tiệm xem nhé!'}</p>`;
  h += `<h3 class="sect">Màu tóc</h3><div class="swatches" role="group" aria-label="Màu tóc">${HAIRS.map((c, i) => `<button class="sw" style="--c:${c.c}" data-act="hair" data-id="${i}" aria-pressed="${S.hair === i}" aria-label="Tóc ${c.n}"></button>`).join('')}</div>`;
  h += `<h3 class="sect">Màu da</h3><div class="swatches" role="group" aria-label="Màu da">${SKINS.map((c, i) => `<button class="sw" style="--c:${c}" data-act="skin" data-id="${i}" aria-pressed="${S.skin === i}" aria-label="Màu da ${i + 1}"></button>`).join('')}</div>`;
  return h;
}

/* --- Góc của mẹ --- */
function parentHTML() {
  const rows = ALL.map(t => {
    const s = S.stats[t.id] || { n: 0, ok: 0 };
    return { t, s, pc: s.n ? Math.round(100 * s.ok / s.n) : null };
  });
  const weak = rows.filter(r => r.s.n >= 5).sort((a, b) => a.pc - b.pc)[0];
  const body = rows.map(r => `<tr><td>${esc(r.t.name)}</td><td><span class="pill" style="--sc:${SUBJ[r.t.subject].c}">${SUBJ[r.t.subject].name}</span></td><td>${r.s.n}</td><td>${r.pc === null ? '-' : r.pc + '%'}</td><td>Mức ${lvl(r.t.id)}</td></tr>`).join('');
  const det = ALL.map(t => `<li><b>${esc(t.name)} (${SUBJ[t.subject].name})</b>: Mức 1 ${DESC[t.id][0].toLowerCase()}; Mức 2 ${DESC[t.id][1].toLowerCase()}; Mức 3 ${DESC[t.id][2].toLowerCase()}.</li>`).join('');
  const cs = curStage(), done = allDone();
  const mi = S.milestones.length
    ? `<div class="milist">${S.milestones.map(m => `<div class="mirow ${m.given ? 'given' : ''}">
<span class="mi" aria-hidden="true">${m.n}</span>
<span><label class="sr" for="gift${m.n}">Món quà mốc ${m.n}</label><input type="text" id="gift${m.n}" data-gift="${m.n}" value="${esc(m.gift)}" placeholder="Mẹ ghi món quà đã tặng..."><span class="when">Đạt ngày ${esc(m.date)}</span></span>
<button class="tick" data-act="given" data-id="${m.n}" aria-pressed="${m.given}">${m.given ? 'Đã tặng' : 'Chưa tặng'}</button></div>`).join('')}</div>`
    : '<p class="empty">Bé chưa đạt mốc nào. Mỗi 100 kim cương kiếm được sẽ ghi nhận một mốc chiến thắng.</p>';
  return `<section class="parent"><h2>Góc của mẹ</h2>
<p class="lede">Bé đã chơi ${S.rounds} lượt và kiếm được tổng cộng ${S.total} kim cương. Cột “Đúng ngay” là tỉ lệ bé làm đúng ngay lần đầu. Game tự tăng mức khi bé đúng liên tiếp 3 câu và hạ mức khi sai liên tiếp 2 câu.</p>
<h3>Mốc chiến thắng và quà</h3>
<p class="lede">Cứ 100 kim cương bé kiếm được là một mốc. Mẹ ghi lại món quà đã tặng ở đây để hai mẹ con cùng nhớ. Kim cương tiêu trong tiệm không làm mất mốc.</p>
${mi}
<h3>Hành trình trên bản đồ</h3>
<p>${done ? 'Bé đã đi hết 10 chặng của Vương quốc thông minh.' : `Bé đang ở chặng ${cs + 1} trong 10: <b>${esc(STAGES[cs].name)}</b>.`}</p>
<h3>Kết quả từng môn</h3>
<div class="tw"><table><thead><tr><th>Chủ đề</th><th>Môn</th><th>Số câu</th><th>Đúng ngay</th><th>Mức</th></tr></thead><tbody>${body}</tbody></table></div>
<p>${weak && weak.pc < 70 ? `Nên luyện thêm: <b>${esc(weak.t.name)}</b> (${SUBJ[weak.t.subject].name}, đúng ngay ${weak.pc}%).` : 'Chưa có chủ đề nào cần luyện thêm. Chơi thêm vài lượt để có số liệu rõ hơn.'}</p>
<details><summary>Nội dung từng mức</summary><ul>${det}</ul></details>
<details><summary>Nội dung bám theo chương trình nào?</summary><ul>
<li><b>Toán lớp 2</b>: cộng trừ trong phạm vi 100, bảng nhân chia 2, 3, 4, 5, so sánh số, xem đồng hồ, dm, m, cm, kg, lít, đường gấp khúc, chu vi, bài toán có lời văn.</li>
<li><b>Tiếng Việt lớp 2</b>: quy tắc chính tả c/k/q, g/gh, ng/ngh và các cặp dễ lẫn l/n, s/x, tr/ch, d/gi/r, dấu hỏi và dấu ngã; từ chỉ sự vật, hoạt động, đặc điểm; từ trái nghĩa; ba kiểu câu Ai là gì, Ai làm gì, Ai thế nào; dấu chấm, dấu phẩy, dấu chấm hỏi, dấu chấm than; viết hoa tên riêng; tiếng và vần.</li>
<li><b>Tiếng Anh lớp 2</b>: theo chương trình Làm quen tiếng Anh, gồm từ vựng theo chủ đề quen thuộc, số đếm, màu sắc và các mẫu câu ngắn. Ở lớp 1 và lớp 2 đây là môn tự chọn, học chủ yếu qua nghe và nói, nên game đọc to từ tiếng Anh cho bé nghe.</li></ul></details>
<p class="lede">Tiến trình lưu trên trình duyệt của thiết bị này. Nếu bé chơi ở máy khác, tiến trình sẽ bắt đầu lại.</p>
${U.confirmReset ? `<p><b>Xóa hết kim cương, đồ đã mua, mốc chiến thắng và tiến trình bản đồ?</b></p><div class="btns" style="justify-content:flex-start"><button class="btn danger" data-act="reset-yes">Xóa hết</button><button class="btn" data-act="reset-no">Không xóa</button></div>` : `<button class="btn danger" data-act="reset">Bắt đầu lại từ đầu</button>`}</section>`;
}

/* --- Sự kiện --- */
function openTask(si, ti) {
  const t = STAGES[si].tasks[ti];
  startQuiz({ topics: t.t, n: qCount(t), stage: si, task: ti, title: t.n });
}
document.addEventListener('click', e => {
  const tb = e.target.closest('.tab');
  if (tb) { go(tb.dataset.tab); return; }
  if (e.target.closest('#soundBtn')) { S.sound = !S.sound; save(); renderHud(); if (S.sound) sfx.coin(); return; }
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act, id = el.dataset.id, Q = U.quiz;
  if (act === 'stage') { U.stage = Number(el.dataset.i); U.tab = 'map'; render(); window.scrollTo({ top: 0 }); }
  else if (act === 'map') { U.stage = null; U.result = null; U.quiz = null; U.tab = 'map'; U.scrollMap = true; render(); }
  else if (act === 'stageback') { U.stage = Number(el.dataset.i); U.result = null; U.quiz = null; U.tab = 'map'; render(); window.scrollTo({ top: 0 }); }
  else if (act === 'task') openTask(Number(el.dataset.i), Number(el.dataset.t));
  else if (act === 'free') startQuiz({ topics: [id], n: 5, stage: null, task: null, title: byId(id).name });
  else if (act === 'retry') { const r = U.result; r.stage != null ? openTask(r.stage, r.task) : startQuiz({ topics: r.topics, n: 5, stage: null, task: null, title: r.title }); }
  else if (act === 'play') go('play');
  else if (act === 'goshop') go('shop');
  else if (act === 'exit') { U.quiz = null; if (U.tab === 'map') U.stage = U.stage; render(); }
  else if (act === 'next') nextQ();
  else if (act === 'say') sayQ(Q.qs[Q.i]);
  else if (act === 'opt') submit(el.dataset.v);
  else if (act === 'key' && Q && !Q.done) {
    const k = el.dataset.k;
    if (k === 'del') { Q.input = Q.input.slice(0, -1); render(); }
    else if (k === 'go') { if (Q.input === '') toast('Con hãy nhập số nhé'); else submit(Q.input); }
    else if (Q.input.length < 3) { Q.input += k; render(); }
  }
  else if (act === 'closecb') { U.celebrate = null; render(); }
  else if (act === 'cat') { U.cat = id; if (Object.keys(U.preview).length) { U.preview = {}; renderStage(); } render(); }
  else if (act === 'try') {
    const it = itemById(id);
    if (S.owned.includes(id)) { S.worn[it.cat] = id; delete U.preview[it.cat]; save(); } else U.preview[it.cat] = id;
    renderStage(); render();
  }
  else if (act === 'wear') { const it = itemById(id); S.worn[it.cat] = id; delete U.preview[it.cat]; save(); renderStage(); render(); moveP('m-twirl'); }
  else if (act === 'unwear') { S.worn[id] = null; delete U.preview[id]; save(); renderStage(); render(); }
  else if (act === 'buy') {
    const it = itemById(id);
    if (S.gems < it.price) { toast(`Cần thêm ${it.price - S.gems} kim cương. Giải bài để kiếm nhé!`); return; }
    S.gems -= it.price; S.owned.push(id); S.worn[it.cat] = id; delete U.preview[it.cat]; save();
    renderHud(); renderStage(); render(); sfx.coin(); burst(); moveP('m-twirl'); toast(`Đã mua ${it.name}!`);
  }
  else if (act === 'hair') { S.hair = Number(id); save(); renderStage(); render(); }
  else if (act === 'skin') { S.skin = Number(id); save(); renderStage(); render(); }
  else if (act === 'given') { const m = S.milestones.find(x => x.n === Number(id)); if (m) { m.given = !m.given; save(); render(); } }
  else if (act === 'reset') { U.confirmReset = true; render(); }
  else if (act === 'reset-no') { U.confirmReset = false; render(); }
  else if (act === 'reset-yes') {
    S = DEF(); save(); U.confirmReset = false; U.preview = {}; U.stage = null; U.celebrate = null;
    $('pname').value = ''; renderHud(); renderStage(); render(); toast('Đã bắt đầu lại từ đầu');
  }
});
document.addEventListener('input', e => {
  const g = e.target.dataset && e.target.dataset.gift;
  if (g) { const m = S.milestones.find(x => x.n === Number(g)); if (m) { m.gift = e.target.value; save(); } }
});
document.addEventListener('keydown', e => {
  const Q = U.quiz;
  if (!Q || Q.done) return;
  if (document.activeElement && document.activeElement.id === 'pname') return;
  const q = Q.qs[Q.i];
  if (q.type !== 'num') return;
  if (/^[0-9]$/.test(e.key) && Q.input.length < 3) { Q.input += e.key; render(); }
  else if (e.key === 'Backspace') { Q.input = Q.input.slice(0, -1); render(); }
  else if (e.key === 'Enter' && Q.input !== '') { e.preventDefault(); submit(Q.input); }
});
$('pname').value = S.name;
$('pname').addEventListener('input', e => { S.name = e.target.value; save(); });
$('gemIcon').innerHTML = GEM;
renderHud(); renderStage(); render();
</script>

</body></html>
